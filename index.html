/* Layout: a phone-width manuscript. Each screen is a page on calm off-white paper; burgundy carries the voice (headings, actions), gold carries the structure (hairlines, frames, the khatam star). Screens stack like an iOS navigation controller; RTL forward enters from the left. */
:root{
  --paper:#F5F2EC; --paper-2:#EFEAE0; --card:#FFFDF9; --ink:#2B2326; --ink-2:rgba(43,35,38,.68); --ink-3:rgba(43,35,38,.44);
  --line:rgba(169,130,58,.26); --line-2:rgba(169,130,58,.14); --gold:#A9823A; --gold-2:#C8A45E; --wine:#7A2236; --wine-2:#9B3A4F; --wine-soft:rgba(122,34,54,.07);
  --ok:#4D7A5A; --bad:#B0453B; --wait:#B6862C; --hl:#3F7F8C;
  --kufi:"Reem Kufi","Geeza Pro","Noto Kufi Arabic",system-ui,sans-serif;
  --ui:-apple-system,"SF Arabic","SF Pro Text",system-ui,"Segoe UI",Tahoma,sans-serif;
  --r:18px; color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.tab{font-variant-numeric:tabular-nums}

#app{position:relative;height:100%;max-width:440px;margin:0 auto;overflow:hidden;background:var(--paper)}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--paper);will-change:transform;-webkit-overflow-scrolling:touch}
.wrap{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:4px 48px;display:flex;flex-direction:column;gap:22px;position:relative}
.dim{position:absolute;inset:0;background:#2B2326;opacity:0;pointer-events:none}
.paper-grain{position:absolute;inset:0;pointer-events:none;opacity:.5;background:
  radial-gradient(80% 50% at 100% 0%,rgba(201,164,94,.10),transparent 70%),
  radial-gradient(70% 45% at 0% 100%,rgba(122,34,54,.05),transparent 70%)}

/* nav bar */
.bar{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:84px 1fr 84px;align-items:center;min-height:54px;
  padding:0 max(8px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px));
  background:rgba(245,242,236,.82);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border-bottom:1px solid var(--line-2)}
.bar h1{margin:0;text-align:center;font-family:var(--kufi);font-weight:700;font-size:20px;color:var(--wine)}
.bar .end{justify-self:end}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:44px;height:44px;padding:0 6px;border-radius:22px;color:var(--wine);font-size:16px;transition:transform .1s ease-out,background .1s}
.ib:active{transform:scale(.93);background:var(--wine-soft)}
.ib svg{width:22px;height:22px}
.ib.rd{border:1px solid var(--line);background:var(--card)}

/* ornament */
.orn{display:flex;align-items:center;gap:10px;color:var(--gold)}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.orn svg{width:14px;height:14px;flex:none}
.sec{display:flex;flex-direction:column;gap:10px}
.sec>h4{margin:0;padding-inline:4px;display:flex;align-items:center;gap:8px;font-family:var(--kufi);font-weight:500;font-size:15px;color:var(--wine)}
.sec>h4 svg{width:11px;height:11px;color:var(--gold)}
.sec>h4 small{margin-inline-start:auto;font-family:var(--ui);font-size:12px;color:var(--ink-3);font-weight:400}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 6px 18px -12px rgba(80,55,20,.25)}
.pin{padding:16px}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:54px;text-align:start;width:100%}
.row+.row{border-top:1px solid var(--line-2)}
button.row{transition:background .1s}
button.row:active{background:var(--wine-soft)}
.row .g{flex:1;min-width:0}
.row .t{font-size:15.5px;line-height:1.4}
.row .s{font-size:12.5px;color:var(--ink-2);line-height:1.5;margin-top:2px}
.row .v{font-size:15px;font-weight:600}
.chev{width:15px;height:15px;color:var(--ink-3);flex:none}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.empty{padding:26px 20px;text-align:center;color:var(--ink-2);font-size:14px;line-height:1.8;display:flex;flex-direction:column;gap:14px;align-items:center}
.empty b{font-family:var(--kufi);font-size:18px;color:var(--wine);font-weight:700}
.pos{color:var(--ok)} .neg{color:var(--bad)} .mut{color:var(--ink-2)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:25px;padding:0 24px;background:var(--wine);color:#FFF8F0;font-weight:600;font-size:16px;transition:transform .1s ease-out,opacity .2s;box-shadow:0 8px 18px -10px rgba(122,34,54,.6)}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.btn.ghost{background:var(--card);color:var(--wine);border:1px solid var(--line);box-shadow:none}
.btn.gold{background:linear-gradient(180deg,#C8A45E,#A9823A);color:#fff}
.btn.danger{background:rgba(176,69,59,.08);color:var(--bad);box-shadow:none}
.btn.sm{height:38px;padding:0 16px;font-size:14px}
.btn:disabled{opacity:.4}
.spinner{display:inline-block;vertical-align:middle;width:20px;height:20px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--wine);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* login */
.login{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;min-height:100%;padding:28px max(22px,env(safe-area-inset-right,0px)) 28px max(22px,env(safe-area-inset-left,0px));position:relative}
.medal{position:relative;width:150px;height:150px;display:grid;place-items:center}
.medal>svg.kh{position:absolute;inset:0;width:100%;height:100%;color:var(--gold)}
.mark{width:74px;height:74px}
.wordclock{font-family:var(--kufi);font-weight:700;font-size:40px;line-height:1;color:var(--wine)}
.dates{color:var(--ink-2);font-size:14px;text-align:center;line-height:1.7}
.dates b{color:var(--ink);font-weight:600}
.prompt{font-family:var(--kufi);font-size:19px;font-weight:500;color:var(--wine);min-height:24px;text-align:center}
.hint{font-size:13px;color:var(--ink-3);min-height:20px;text-align:center}
.slots{display:flex;gap:9px;direction:ltr}
.slot{width:38px;height:46px;border-radius:11px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;transition:border-color .15s}
.slot.on{border-color:var(--wine)}
.slot.on::after{content:"";width:9px;height:9px;transform:rotate(45deg);background:var(--wine)}
.slots.err .slot{border-color:var(--bad)}
.shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;direction:ltr;width:100%;max-width:316px}
.key{height:56px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:23px;font-weight:500;display:grid;place-items:center;transition:transform .1s ease-out,background .1s;color:var(--ink)}
.key.sym{color:var(--gold);font-weight:700}
.key:active{transform:scale(.94);background:var(--wine-soft)}
.key svg{width:24px;height:24px;color:var(--wine)}
.field{width:100%;max-width:316px;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:0 16px;font-size:17px;text-align:center}

/* home */
.hello{display:flex;flex-direction:column;gap:4px;padding-top:6px}
.hello .k{font-size:14px;color:var(--gold);font-family:var(--kufi);font-weight:500}
.hello h2{margin:0;font-family:var(--kufi);font-weight:700;font-size:34px;line-height:1.2;color:var(--wine);text-wrap:balance}
.hello p{margin:0;color:var(--ink-2);font-size:13.5px;line-height:1.7}
.board{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:16px;min-height:138px;padding:16px;border-radius:var(--r);text-align:start;background:var(--card);border:1px solid var(--line);transition:transform .1s ease-out;box-shadow:0 6px 18px -12px rgba(80,55,20,.25)}
.tile::after{content:"";position:absolute;inset:5px;border:1px solid var(--line-2);border-radius:14px;pointer-events:none}
.tile:active{transform:scale(.97)}
.tile .ic{width:36px;height:36px;display:grid;place-items:center;color:var(--wine)}
.tile .ic svg{width:26px;height:26px}
.tile h3{margin:0;font-family:var(--kufi);font-size:21px;font-weight:700;color:var(--ink)}
.tile small{display:block;color:var(--ink-2);font-size:12.5px;line-height:1.55;margin-top:3px}
.tile.locked{opacity:.5}
.tile .lk{position:absolute;top:15px;left:15px;width:16px;height:16px;color:var(--ink-3)}
.hub{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:16px;padding:2px 0}
.hub .medal{width:96px;height:96px}
.hub .mark{width:46px;height:46px}
.hub .clock{font-family:var(--kufi);font-size:30px;font-weight:700;color:var(--wine)}
.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;justify-content:flex-start;gap:12px;padding:14px 16px}
.wide h3{font-size:17px}
.addcard{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r);text-align:start;color:#FFF8F0;background:linear-gradient(135deg,#7A2236,#5E1828);position:relative;overflow:hidden;transition:transform .1s ease-out;box-shadow:0 12px 24px -14px rgba(122,34,54,.7)}
.addcard:active{transform:scale(.98)}
.addcard .pl{width:44px;height:44px;border-radius:50%;border:1px solid rgba(200,164,94,.7);display:grid;place-items:center;color:#E7CF9B;flex:none}
.addcard .pl svg{width:22px;height:22px}
.addcard h3{margin:0;font-family:var(--kufi);font-size:19px;font-weight:700}
.addcard small{display:block;font-size:12.5px;opacity:.82;margin-top:2px;line-height:1.5}
.addcard .kh{position:absolute;inset-inline-end:-24px;top:-24px;width:120px;height:120px;color:rgba(200,164,94,.28)}

/* finance */
.ftable{width:100%;border-collapse:collapse;font-size:13.5px}
.ftable th{font-weight:500;color:var(--ink-3);font-size:12px;padding:12px 4px 9px;text-align:center}
.ftable th:first-child{text-align:start;padding-inline-start:16px}
.ftable td{padding:12px 4px;text-align:center;border-top:1px solid var(--line-2)}
.ftable td:first-child{text-align:start;padding-inline-start:16px;font-family:var(--kufi);font-weight:500;color:var(--wine);font-size:15px}
.ftable tr.net td{font-weight:700;font-size:14.5px;background:var(--wine-soft)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:7px;min-width:0}
.kpi .k{font-size:12px;color:var(--ink-2)}
.kpi .n{font-size:23px;font-weight:700;line-height:1.1}
.kpi .n small{font-size:12px;font-weight:500;color:var(--ink-2)}
.meter{position:relative;height:5px;border-radius:3px;background:var(--paper-2)}
.meter i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:3px}
.meter b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink-3);border-radius:1px}
.note{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.75}
.note+.note{border-top:1px solid var(--line-2);padding-top:12px;margin-top:12px}
.note svg{width:11px;height:11px;flex:none;margin-top:6px}

/* schedule */
.today{display:flex;justify-content:space-between;align-items:center;gap:12px}
.today .big{font-family:var(--kufi);font-size:30px;font-weight:700;line-height:1;color:var(--wine)}
.next{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2);margin-top:12px;padding-top:12px;border-top:1px solid var(--line-2)}
.next b{color:var(--wine)}
.task{display:flex;align-items:center;gap:10px;padding:13px 14px 13px 12px}
.task+.task{border-top:1px solid var(--line-2)}
.task .time{width:62px;flex:none;white-space:nowrap;font-size:12.5px;color:var(--ink-2);text-align:center}
.task .g{flex:1;min-width:0}
.task .t{font-size:15px;line-height:1.4}
.task.st-done .t{color:var(--ink-3);text-decoration:line-through;text-decoration-color:rgba(77,122,90,.6)}
.chip{display:inline-flex;gap:4px;align-items:center;font-size:11px;padding:2px 8px;border-radius:8px;border:1px solid var(--line-2);color:var(--ink-2);margin-top:5px;margin-inline-end:4px}
.chip.link{color:var(--wine);border-color:rgba(122,34,54,.18);background:var(--wine-soft)}
.tri{display:flex;gap:6px;flex:none}
.c3{width:31px;height:31px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--ink-3);background:var(--card);transition:transform .1s ease-out,background .15s,border-color .15s,color .15s}
.c3 svg{width:15px;height:15px}
.c3:active{transform:scale(.88)}
.c3.done.on{background:var(--ok);border-color:var(--ok);color:#fff}
.c3.miss.on{background:var(--bad);border-color:var(--bad);color:#fff}
.c3.later.on{background:var(--wait);border-color:var(--wait);color:#fff}
.legend{display:flex;gap:14px;justify-content:flex-end;font-size:11.5px;color:var(--ink-3);padding:0 6px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.score{display:flex;align-items:center;gap:16px}
.ring{width:86px;height:86px;flex:none}
.score .lbl{font-size:13px;color:var(--ink-2);line-height:1.7}
.score .lbl b{font-family:var(--kufi);color:var(--wine);font-size:16px;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:12.5px;padding:6px 11px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:inline-flex;gap:6px;align-items:center}
.chart{width:100%;height:auto;display:block}

/* add page */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.step{padding:12px 10px;border-radius:14px;background:var(--card);border:1px solid var(--line-2);display:flex;flex-direction:column;gap:6px;min-width:0}
.step b{font-family:var(--kufi);color:var(--gold);font-size:18px;line-height:1}
.step span{font-size:12.5px;line-height:1.55;color:var(--ink-2)}
textarea{width:100%;min-height:150px;border:0;background:transparent;color:var(--ink);padding:14px 16px;font:15px/1.7 var(--ui);resize:vertical;outline:none;direction:rtl}
.tools{display:flex;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.tools label.btn{cursor:pointer}
.pv{display:flex;align-items:center;gap:12px;padding:12px 16px}
.pv+.pv{border-top:1px solid var(--line-2)}
.pv .tag{font-size:11px;padding:3px 8px;border-radius:7px;flex:none;font-weight:600}
.tag.debt{background:rgba(176,69,59,.1);color:var(--bad)} .tag.income{background:rgba(77,122,90,.12);color:var(--ok)} .tag.expense{background:rgba(182,134,44,.12);color:var(--wait)} .tag.task{background:var(--wine-soft);color:var(--wine)} .tag.med,.tag.appt{background:rgba(63,127,140,.12);color:var(--hl)} .tag.wird{background:rgba(169,130,58,.14);color:var(--gold)}
.pill.on{background:var(--wine);color:#fff;border-color:var(--wine)}
.pv .err{color:var(--bad);font-size:12px}
.toggle-row{display:flex;align-items:center;gap:12px;padding:12px 16px;font-size:14px;color:var(--ink-2)}

/* sheet + forms */
.sheet-wrap{position:absolute;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:rgba(43,35,38,.38);opacity:0}
.sheet{position:absolute;inset-inline:0;bottom:0;max-height:92%;display:flex;flex-direction:column;border-radius:26px 26px 0 0;background:rgba(245,242,236,.96);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border-top:1px solid var(--line);box-shadow:0 -20px 50px -20px rgba(43,35,38,.35);will-change:transform}
.grab{padding:8px 12px 6px;touch-action:none;cursor:grab}
.grab::before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.grab .hd{display:grid;grid-template-columns:84px 1fr 84px;align-items:center}
.grab h3{margin:0;text-align:center;font-family:var(--kufi);font-size:18px;font-weight:700;color:var(--wine)}
.sheet .body{overflow-y:auto;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(26px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--paper-2);border-radius:12px;padding:3px;gap:3px}
.seg button{height:34px;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink-2);transition:background .15s,color .15s}
.seg button.on{background:var(--card);color:var(--wine);box-shadow:0 1px 4px rgba(43,35,38,.12)}
.fr{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:52px}
.fr+.fr{border-top:1px solid var(--line-2)}
.fr label{flex:none;font-size:15px}
.fr input,.fr select{flex:1;min-width:0;height:50px;background:transparent;border:0;text-align:end;font-size:16px;color:var(--ink-2);outline:none}
.fr input:focus,.fr select:focus{color:var(--ink)}
.fr select{appearance:none;-webkit-appearance:none;direction:rtl}
.help{font-size:12.5px;color:var(--ink-3);padding:0 6px;line-height:1.7}
.preview{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.preview div{padding:10px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.preview span{font-size:11px;color:var(--ink-2)}
.preview b{font-size:15px}
.switch{position:relative;width:51px;height:31px;flex:none;border-radius:16px;background:var(--paper-2);border:1px solid var(--line);transition:background .2s}
.switch::after{content:"";position:absolute;top:1px;inset-inline-start:1px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:transform .25s cubic-bezier(.3,1.3,.5,1)}
.switch.on{background:var(--wine);border-color:var(--wine)}
.switch.on::after{transform:translateX(-20px)}
.mono{font:13px/1.55 ui-monospace,Menlo,monospace;direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-word}
.toast{position:absolute;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;padding:10px 18px;border-radius:20px;background:var(--ink);color:#FFF8F0;font-size:14px;font-weight:600;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
.banner{font-size:12.5px;color:var(--wait);background:rgba(182,134,44,.08);border:1px solid rgba(182,134,44,.25);border-radius:12px;padding:10px 12px;line-height:1.6}

@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (prefers-reduced-transparency: reduce){.bar,.sheet{background:var(--paper);backdrop-filter:none;-webkit-backdrop-filter:none}}
</style>

<div id="app" dir="rtl" lang="ar">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9B3A4F"/><stop offset=".5" stop-color="#7A2236"/><stop offset="1" stop-color="#A9823A"/></linearGradient>
  </defs></svg>
  <section class="screen" id="s-login"><div class="paper-grain"></div><div class="login" id="login"></div></section>
  <section class="screen" id="s-home" hidden></section>
  <section class="screen" id="s-finance" hidden></section>
  <section class="screen" id="s-schedule" hidden></section>
  <section class="screen" id="s-add" hidden></section>
  <section class="screen" id="s-religion" hidden></section>
  <section class="screen" id="s-health" hidden></section>
  <section class="screen" id="s-settings" hidden></section>
  <div class="toast" id="toast" role="status"></div>
</div>

<script>
(()=>{"use strict";
/* ───────── identity & icons ───────── */
const MARK=`<svg class="mark" viewBox="10 8 84 84" aria-label="gh"><path d="M47 66H21V36h26v48H21M47 66H63M63 16v50M63 36h22v30" fill="none" stroke="url(#gg)" stroke-width="8.5" stroke-linejoin="miter" stroke-linecap="square"/></svg>`;
/* khatam: the eight-pointed star of two squares, drawn as gold hairlines */
const KHATAM=(cls="kh")=>`<svg class="${cls}" viewBox="0 0 100 100" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="50" cy="50" r="48" stroke-width=".6"/><circle cx="50" cy="50" r="44.5" stroke-width=".4" stroke-dasharray="1 2.2"/><rect x="18" y="18" width="64" height="64" stroke-width=".9"/><rect x="18" y="18" width="64" height="64" stroke-width=".9" transform="rotate(45 50 50)"/><circle cx="50" cy="50" r="27" stroke-width=".5"/></svg>`;
const STAR=`<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><rect x="4.5" y="4.5" width="11" height="11"/><rect x="4.5" y="4.5" width="11" height="11" transform="rotate(45 10 10)"/></svg>`;
const ORN=`<div class="orn">${STAR}</div>`;
const I={
 back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',

/* ───────── crypto: the 6-char code is the only key ───────── */
const ITER=600000,enc=new TextEncoder(),dec=new TextDecoder();
const b64=u=>{let s="";u=new Uint8Array(u);for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(code,salt,iter=ITER){const base=await crypto.subtle.importKey("raw",enc.encode(code),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function seal(obj,key,salt){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,enc.encode(JSON.stringify(obj)));return JSON.stringify({v:2,alg:"AES-256-GCM",kdf:"PBKDF2-SHA256",iter:ITER,salt:b64(salt),iv:b64(iv),ct:b64(ct)})}
async function unseal(blob,code){const o=JSON.parse(blob);const salt=unb64(o.salt);const key=await deriveKey(code,salt,o.iter||ITER);const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(o.iv)},key,unb64(o.ct));return{data:JSON.parse(dec.decode(pt)),key,salt}}

/* ───────── springs (response + damping, interruptible) ───────── */
class Spring{constructor(v,cb){this.x=v;this.v=0;this.t=v;this.cb=cb;this.raf=0}
 to(t,{response=.38,damping=1,velocity}={}){this.t=t;if(velocity!=null)this.v=velocity;this.k=Math.pow(2*Math.PI/response,2);this.c=4*Math.PI*damping/response;
  if(reduceMotion){this.set(t);return Promise.resolve()}
  return new Promise(res=>{const prev=this.done;this.done=()=>{prev&&prev();res()};if(!this.raf){let last=performance.now();const step=now=>{let dt=Math.min(.064,(now-last)/1000);last=now;const n=Math.max(1,Math.ceil(dt/(1/240)));const h=dt/n;
    for(let i=0;i<n;i++){const a=-this.k*(this.x-this.t)-this.c*this.v;this.v+=a*h;this.x+=this.v*h}
    if(Math.abs(this.x-this.t)<.3&&Math.abs(this.v)<4){this.x=this.t;this.v=0;this.raf=0;this.cb(this.x);const d=this.done;this.done=null;d&&d();return}
    this.cb(this.x);this.raf=requestAnimationFrame(step)};this.raf=requestAnimationFrame(step)}})}
 set(x){cancelAnimationFrame(this.raf);this.raf=0;this.x=this.t=x;this.v=0;this.cb(x);const d=this.done;this.done=null;d&&d()}
 stop(){cancelAnimationFrame(this.raf);this.raf=0}}
const project=(v,d=.998)=>(v/1000)*d/(1-d);
const rubber=(o,dim,c=.55)=>(o*dim*c)/(dim+c*Math.abs(o));
function tracker(){const h=[];return{push(x){const t=performance.now();h.push([x,t]);while(h.length>1&&t-h[0][1]>100)h.shift()},vel(){if(h.length<2)return 0;const [x0,t0]=h[0],[x1,t1]=h[h.length-1];return t1>t0?(x1-x0)/((t1-t0)/1000):0}}}

const app=$("#app");const stack=[];const W=()=>app.clientWidth;
function ensureDim(s){if(s&&!s.querySelector(":scope>.dim")){const d=document.createElement("div");d.className="dim";s.appendChild(d)}}
function place(top,under,x){top.style.transform=`translate3d(${x}px,0,0)`;if(under){under.style.transform=`translate3d(${.3*(x+W())}px,0,0)`;const d=under.querySelector(":scope>.dim");if(d)d.style.opacity=String(.12*(1+x/W()))}}
function show(id){for(const s of app.querySelectorAll(".screen")){s.hidden=s.id!==id;s.style.transform=""}stack.length=0;stack.push(id)}
function push(id){const under=$("#"+stack[stack.length-1]),top=$("#"+id);RENDER[id]&&RENDER[id]();top.hidden=false;top.scrollTop=0;stack.push(id);ensureDim(under);
 const sp=new Spring(-W(),x=>place(top,under,x));top._sp=sp;sp.set(-W());sp.to(0,{response:.42,damping:1})}
function pop(velocity){if(stack.length<2)return;const top=$("#"+stack[stack.length-1]),under=$("#"+stack[stack.length-2]);
 const sp=top._sp||new Spring(0,()=>{});sp.cb=x=>place(top,under,x);stack.pop();RENDER[under.id]&&RENDER[under.id]();ensureDim(under);
 sp.to(-W(),{response:.38,damping:1,velocity}).then(()=>{if(stack[stack.length-1]===under.id){top.hidden=true;top.style.transform="";under.style.transform="";const d=under.querySelector(":scope>.dim");d&&(d.style.opacity="0")}})}
(()=>{let st=null;
 app.addEventListener("pointerdown",e=>{if(stack.length<2||$(".sheet-wrap"))return;const r=app.getBoundingClientRect();if(e.clientX<r.right-26)return;
  const top=$("#"+stack[stack.length-1]),under=$("#"+stack[stack.length-2]);top._sp&&top._sp.stop();
  st={id:e.pointerId,x0:e.clientX,base:top._sp?top._sp.x:0,top,under,tr:tracker(),live:false,cur:0};st.tr.push(e.clientX)},{passive:true});
 app.addEventListener("pointermove",e=>{if(!st||e.pointerId!==st.id)return;let x=st.base+(e.clientX-st.x0);if(!st.live){if(Math.abs(e.clientX-st.x0)<10)return;st.live=true;try{app.setPointerCapture(e.pointerId)}catch(_){}}
  if(x>0)x=rubber(x,W());st.tr.push(e.clientX);place(st.top,st.under,x);st.cur=x});
 const end=e=>{if(!st||e.pointerId!==st.id)return;const s=st;st=null;if(!s.live)return;const v=s.tr.vel();const proj=s.cur+project(v);
  const sp=s.top._sp||new Spring(s.cur,()=>{});s.top._sp=sp;sp.x=s.cur;sp.cb=x=>place(s.top,s.under,x);
  if(proj<-W()/2)pop(v);else sp.to(0,{response:.35,damping:Math.abs(v)>300?.82:1,velocity:v})};
 app.addEventListener("pointerup",end);app.addEventListener("pointercancel",end)})();

/* ───────── sheets ───────── */
function openSheet(title,body,{action,onMount,onClose}={}){
 const wrap=document.createElement("div");wrap.className="sheet-wrap";
 wrap.innerHTML=`<div class="scrim"></div><div class="sheet" role="dialog" aria-label="${esc(title)}"><div class="grab"><div class="hd"><button class="ib" data-x="close">إلغاء</button><h3>${esc(title)}</h3><span style="justify-self:end">${action?`<button class="ib" data-x="act" style="font-weight:700">${esc(action)}</button>`:""}</span></div></div><div class="body">${body}</div></div>`;
 app.appendChild(wrap);const sh=$(".sheet",wrap),scrim=$(".scrim",wrap);const H=()=>sh.offsetHeight||500;
 const sp=new Spring(H(),y=>{sh.style.transform=`translate3d(0,${y}px,0)`;scrim.style.opacity=String(Math.max(0,1-y/H()))});sp.set(H());sp.to(0,{response:.4,damping:1});
 const api={el:wrap,close(v){sp.to(H()+20,{response:.32,damping:1,velocity:v}).then(()=>{wrap.remove();onClose&&onClose()})}};
 scrim.addEventListener("click",()=>api.close());
 wrap.addEventListener("click",e=>{const b=e.target.closest("[data-x]");if(!b)return;if(b.dataset.x==="close")api.close();if(b.dataset.x==="act")api.onAct&&api.onAct()});
 const g=$(".grab",wrap);let st=null;
 g.addEventListener("pointerdown",e=>{if(e.target.closest("button"))return;sp.stop();st={y0:e.clientY,base:sp.x,tr:tracker()};st.tr.push(e.clientY);g.setPointerCapture(e.pointerId)});

 const end=()=>{if(!st)return;const v=st.tr.vel();st=null;const p=sp.x+project(v);if(p>H()*.45)api.close(v);else sp.to(0,{response:.3,damping:Math.abs(v)>300?.8:1,velocity:v})};
 g.addEventListener("pointerup",end);g.addEventListener("pointercancel",end);
 onMount&&onMount(sh,api);return api}

/* ───────── prayer times (Umm al-Qura) ───────── */
const D2R=Math.PI/180,R2D=180/Math.PI;
const dsin=d=>Math.sin(d*D2R),dcos=d=>Math.cos(d*D2R),dtan=d=>Math.tan(d*D2R),darcsin=x=>Math.asin(x)*R2D,darccos=x=>Math.acos(Math.max(-1,Math.min(1,x)))*R2D,darctan2=(y,x)=>Math.atan2(y,x)*R2D,darccot=x=>Math.atan(1/x)*R2D;
const fix=(a,b)=>{a=a-b*Math.floor(a/b);return a<0?a+b:a};
function prayerTimes(date,lat,lng,tz){let y=date.getFullYear(),m=date.getMonth()+1,d=date.getDate();if(m<=2){y-=1;m+=12}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);
 const jd=Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5-lng/(15*24);
 const sun=t=>{const D=jd+t-2451545,g=fix(357.529+.98560028*D,360),q=fix(280.459+.98564736*D,360),L=fix(q+1.915*dsin(g)+.02*dsin(2*g),360),e=23.439-.00000036*D;const RA=fix(darctan2(dcos(e)*dsin(L),dcos(L))/15,24);return{decl:darcsin(dsin(e)*dsin(L)),eqt:q/15-RA}};
 const noon=t=>fix(12-sun(t).eqt,24);
 const angleT=(ang,t,ccw)=>{const dc=sun(t).decl,n=noon(t),T=darccos((-dsin(ang)-dsin(dc)*dsin(lat))/(dcos(dc)*dcos(lat)))/15;return n+(ccw?-T:T)};
 const asr=t=>{const dc=sun(t).decl;return angleT(-darccot(1+dtan(Math.abs(lat-dc))),t)};
 const adj=h=>h+tz-lng/15;const sunset=adj(angleT(.833,18/24));const ram=hijriMonth(date)===9;
 return{fajr:adj(angleT(18.5,5/24,true)),sunrise:adj(angleT(.833,6/24,true)),dhuhr:adj(noon(12/24)),asr:adj(asr(13/24)),maghrib:sunset,isha:sunset+(ram?2:1.5)}}
const PRAYERS=[["fajr","الفجر"],["dhuhr","الظهر"],["asr","العصر"],["maghrib","المغرب"],["isha","العشاء"]];
const CITIES={riyadh:["الرياض",24.7136,46.6753],jeddah:["جدة",21.4858,39.1925],makkah:["مكة المكرمة",21.3891,39.8579],madinah:["المدينة المنورة",24.5247,39.5692],dammam:["الدمام",26.4207,50.0888],khobar:["الخبر",26.2172,50.1971],abha:["أبها",18.2164,42.5053],taif:["الطائف",21.2703,40.4158],buraydah:["بريدة",26.3260,43.9750],hail:["حائل",27.5114,41.7208],tabuk:["تبوك",28.3835,36.5662],jazan:["جازان",16.8892,42.5511],najran:["نجران",17.5650,44.2289],ahsa:["الأحساء",25.3830,49.5860]};
const city=()=>{const s=V.settings;const c=CITIES[s.city]||CITIES.riyadh;return{name:c[0],lat:c[1],lng:c[2],tz:s.tz??3}};
function nextPrayer(now=new Date()){const c=city();const t=prayerTimes(now,c.lat,c.lng,c.tz);const h=now.getHours()+now.getMinutes()/60;for(const [k,n] of PRAYERS)if(t[k]>h)return{name:n,at:t[k],mins:Math.round((t[k]-h)*60)};const t2=prayerTimes(addDays(now,1),c.lat,c.lng,c.tz);return{name:"الفجر",at:t2.fajr,mins:Math.round((24-h+t2.fajr)*60)}}

/* ───────── finance engine ───────── */
const FREQ={daily:["يومي",365/12],weekly:["أسبوعي",52/12],monthly:["شهري",1],yearly:["سنوي",1/12],once:["مرة واحدة",0]};
const CAT={income:{salary:"راتب",freelance:"عمل حر",business:"تجارة",rent:"إيجار",invest:"استثمار",other:"أخرى"},
 debt:{personal:"تمويل شخصي",home:"تمويل عقاري",car:"تمويل سيارة",card:"بطاقة ائتمانية",private:"دين لشخص",other:"أخرى"},
 expense:{housing:"سكن",bills:"فواتير",transport:"مواصلات",food:"أكل",family:"أسرة",subs:"اشتراكات",charity:"صدقة وزكاة",health:"صحة",other:"أخرى"},
 task:{general:"عام",money:"مالي",personal:"شخصي",work:"عمل",religion:"ديني",health:"صحي"}};
const KIND={income:"دخل",debt:"دين",expense:"مصروف",task:"مهمة",med:"دواء",appt:"موعد",wird:"ورد"};
function loan(it){const P=it.amount||0,n=Math.max(1,Math.round(it.months||1)),r=(it.rate||0)/100;let inst,profit;
 if(r<=0){inst=P/n;profit=0}else if(it.rateType==="reducing"){const i=r/12;inst=P*i/(1-Math.pow(1+i,-n));profit=inst*n-P}else{profit=P*r*n/12;inst=(P+profit)/n}
 let apr=0;if(profit>0.01){let lo=0,hi=1;for(let k=0;k<80;k++){const i=(lo+hi)/2;const pv=inst*(1-Math.pow(1+i,-n))/i;pv>P?lo=i:hi=i}apr=((lo+hi)/2)*12*100}
 return{inst,profit,apr,n,P}}
function debtState(it,today){const L=loan(it);const start=parse(it.start);let paid=0;for(let k=1;k<=L.n;k++){if(addMonths(start,k)<=today)paid++;else break}
 const rem=L.n-paid;const end=addMonths(start,L.n);let remPrincipal;
 if(it.rateType==="reducing"&&it.rate>0){const i=it.rate/1200;remPrincipal=L.P*Math.pow(1+i,paid)-L.inst*(Math.pow(1+i,paid)-1)/i}else remPrincipal=L.P*(rem/L.n);
 let confirmed=0;for(const day in V.log)for(const id in V.log[day])if(id.startsWith("d-"+it.id+"-")&&V.log[day][id]==="done")confirmed++;
 return{...L,paid,rem,end,remTotal:L.inst*rem,remProfit:L.inst*rem-remPrincipal,next:rem>0?addMonths(start,paid+1):null,confirmed}}
function flowState(it,today){const start=parse(it.start);const months=it.months||0;const end=months?addMonths(start,months):null;
 const active=!end||today<end;const remMonths=end?Math.max(0,monthsBetween(today,end)+(today<end?1:0)):Infinity;
 return{active,end,remMonths:Math.min(remMonths,months||Infinity),monthly:active?(it.amount||0)*FREQ[it.freq||"monthly"][1]:0}}
function finance(today=new Date()){const t=startOfDay(today);let inc=0,exp=0,inst=0,incY=0,expY=0,remDebt=0,remProfit=0,lastEnd=null;const debts=[];
 for(const it of finRecs()){if(it.kind==="debt"){const s=debtState(it,t);if(s.rem>0){inst+=s.inst;expY+=s.inst*Math.min(12,s.rem);remDebt+=s.remTotal;remProfit+=Math.max(0,s.remProfit);if(!lastEnd||s.end>lastEnd)lastEnd=s.end;debts.push({it,s})}}
  else{const f=flowState(it,t);if(!f.active)continue;const y=f.monthly*Math.min(12,f.remMonths);if(it.kind==="income"){inc+=f.monthly;incY+=y}else{exp+=f.monthly;expY+=y}}}
 const out=exp+inst,net=inc-out;return{inc,exp,inst,out,net,incY,outY:expY,netY:incY-expY,remDebt,remProfit,lastEnd,debts,dbr:inc?inst/inc:0,save:inc?net/inc:0}}
function occDates(it,t0,t1){const out=[];const start=parse(it.start);
 if(it.kind==="debt"){const n=Math.max(1,Math.round(it.months||1));let k=Math.max(1,monthsBetween(start,t0));for(;k<=n;k++){const d=addMonths(start,k);if(d>t1)break;if(d>=t0)out.push({d,k,n})}return out}
 const f=it.freq||"monthly";const end=it.months?addMonths(start,it.months):null;
 if(f==="once"){if(start>=t0&&start<=t1)out.push({d:start});return out}
 if(f==="daily"){let d=start>t0?start:t0;while(d<=t1){if(!end||d<end)out.push({d});d=addDays(d,1)}return out}
 const mb=Math.max(0,monthsBetween(start,t0));let k=f==="weekly"?Math.max(0,Math.floor((t0-start)/(7*864e5))):f==="monthly"?Math.max(0,mb-1):Math.max(0,Math.floor(mb/12)-1);const k0=k;
 while(k-k0<70){const d=f==="weekly"?addDays(start,7*k):f==="monthly"?addMonths(start,k):addMonths(start,12*k);if(d>t1)break;if(d>=t0&&(!end||d<end))out.push({d});k++}
 return out}
function upcoming(days=30){const t0=startOfDay(new Date()),t1=addDays(t0,days);const out=[];
 for(const it of finRecs()){if((it.freq||"")==="daily")continue;for(const o of occDates(it,t0,t1)){const sign=it.kind==="income"?1:-1;const amt=it.kind==="debt"?loan(it).inst:it.amount;out.push({d:o.d,it,amt:sign*amt,label:it.kind==="debt"?`قسط ${o.k} من ${o.n}`:FREQ[it.freq||"monthly"][0]})}}
 return out.sort((a,b)=>a.d-b.d)}

/* ───────── tasks engine (prayers + linked finance tasks + own tasks) ───────── */
const REC={once:"مرة",daily:"يومي",weekly:"أسبوعي",monthly:"شهري",yearly:"سنوي"};
const TCOL={prayer:"--ok",money:"--gold",general:"--wine",personal:"--wait",work:"--wine-2",religion:"--gold",health:"--hl"};
const TNAME={prayer:"صلاة",money:"مالي",general:"عام",personal:"شخصي",work:"عمل",religion:"ديني",health:"صحي"};
function occurs(tk,ds){const d=parse(ds),s=parse(tk.date);if(d<s)return false;switch(tk.recur){case"once":return ds===tk.date;case"daily":return true;case"weekly":return d.getDay()===s.getDay();
 case"monthly":{const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return d.getDate()===Math.min(s.getDate(),last)}case"yearly":return d.getMonth()===s.getMonth()&&d.getDate()===s.getDate()}return false}
function tasksFor(ds){const d=parse(ds);const list=[];const c=city();
 const t=prayerTimes(d,c.lat,c.lng,c.tz);if(V.settings.prayers!==false){for(const [k,n] of PRAYERS)list.push({id:"p-"+k,title:"صلاة "+n,time:t[k],cat:"prayer"})}
 for(const it of finRecs()){
  if(it.kind==="income"&&it.work&&it.work.on){const s=parse(it.start);const end=it.months?addMonths(s,it.months):null;const ok=d>=s&&(it.work.recur==="daily"||d.getDay()===(it.work.weekday??s.getDay()));if(ok&&(!end||d<end))list.push({id:"w-"+it.id,title:"وقت عمل: "+it.title,time:hhmmToH(it.work.time),cat:"money",link:it.id})}
  if(it.remind!==false&&(it.kind==="debt"||(it.kind==="expense"&&["monthly","yearly","once"].includes(it.freq||"monthly")))){
   for(const o of occDates(it,d,d))list.push(it.kind==="debt"?{id:`d-${it.id}-${o.k}`,title:`سداد القسط ${o.k} من ${o.n}`,cat:"money",link:it.id,time:null}:{id:`e-${it.id}-${ds}`,title:`دفع ${it.title}`,cat:"money",link:it.id,time:null})}}
 {const fn=fastName(d);list.push(...relTasks(ds,d,t,fn),...healthTasks(ds,d,t,fn))}
 for(const tk of recs("task"))if(occurs(tk,ds))list.push({id:"t-"+tk.id,title:tk.title,time:hhmmToH(tk.time),cat:tk.cat||"general",ref:tk.id,link:tk.link});
 const prev=ymd(addDays(d,-1)),pl=V.log[prev]||{};const have=new Set(list.map(x=>x.id));
 for(const id in pl)if(pl[id]==="later"&&!have.has(id)){const src=V.carry?.[id];if(src)list.push({...src,id,carried:true})}
 return list.sort((a,b)=>(a.time??99)-(b.time??99))}
function dayScore(ds,isPast){if(V.created&&ds<V.created)return{list:[],done:0,later:0,miss:0,pend:0,tot:0,score:null,by:{}};const list=tasksFor(ds),log=V.log[ds]||{};let done=0,later=0,miss=0,pend=0;const by={};
 for(const t of list){const st=log[t.id];const b=by[t.cat]||(by[t.cat]={done:0,tot:0});if(st==="done"){done++;b.done++;b.tot++}else if(st==="later"){later++;b.done+=.5;b.tot++}else if(st==="missed"||isPast){miss++;b.tot++}else pend++}
 const tot=done+later+miss;return{list,done,later,miss,pend,tot,score:tot?Math.round(100*(done+.5*later)/tot):null,by}}

 let p=`أنت مساعدي لتجهيز بيانات تطبيقي الشخصي «gh» لإدارة الحياة والمال. اليوم ${today}.

const norm=s=>latin(s).replace(/[ـً-ْ]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/\s+/g," ").trim().toLowerCase();
function kindOf(h){const n=norm(h);if(/دواء|ادويه|علاج|دوا/.test(n))return"med";if(/موعد|مواعيد/.test(n))return"appt";if(/ورد|اوراد|ذكر|اذكار|عباد/.test(n))return"wird";if(/دين|ديون|قرض|تمويل|debt/.test(n))return"debt";if(/دخل|راتب|income/.test(n))return"income";if(/مصروف|مصاريف|صرف|فاتور|expense/.test(n))return"expense";if(/مهم|task|عاد/.test(n))return"task";return null}
function catOf(kind,v){const n=norm(v||"");const m=CAT[kind];for(const [k,lab] of Object.entries(m))if(n&&(norm(lab)===n||n.includes(norm(lab))||norm(lab).includes(n)))return k;const ks=Object.keys(m);return kind==="task"?ks[0]:ks[ks.length-1]}
function freqOf(v){const n=norm(v||"");if(/يوم/.test(n))return"daily";if(/اسبوع|weekly/.test(n))return"weekly";if(/سنو|سنه|yearly/.test(n))return"yearly";if(/مره|once|واحد/.test(n))return"once";return"monthly"}
function dateOf(v){const s=latin(v||"").trim();let m=s.match(/(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);if(m)return`${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;m=s.match(/(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/);if(m)return`${m[3]}-${pad2(m[2])}-${pad2(m[1])}`;return null}
function monthsOf(v){const n=norm(v||"");const x=toNum(n);if(/سن|year/.test(n))return Math.round(x*12);return Math.round(x)}
function timeOf(v){const s=latin(v||"");const m=s.match(/(\d{1,2})[:.](\d{2})/);if(!m){const h=s.match(/(\d{1,2})/);if(!h)return"";let H=+h[1];if(/م|pm/i.test(s)&&H<12)H+=12;return`${pad2(H)}:00`}let H=+m[1];if(/(^|\s)م($|\s)|pm/i.test(s)&&H<12)H+=12;return`${pad2(H)}:${m[2]}`}
function parseMD(text){const src=latin(text).replace(/```[a-z]*\n?/gi,"");const parts=src.split(/^\s*#{1,4}\s+/m).slice(1);const items=[];
 for(const p of parts){const lines=p.split("\n");const kind=kindOf(lines[0]);const f={};
  for(const ln of lines.slice(1)){const m=ln.match(/^\s*[-*•]?\s*([^:：]+)[:：]\s*(.*)$/);if(!m)continue;const key=norm(m[1]);const val=m[2].trim();if(!val||/^\(.*\)$/.test(val))continue;
   const K=/^(الاسم|اسم|العنوان|المهمه)$/.test(key)?"title":/جرع/.test(key)?"dose":/اوقات/.test(key)?"times":/(مكان|طبيب)/.test(key)?"place":/مخزون/.test(key)?"stock":/(تكلف|سعر)/.test(key)?"cost":/^بعد$/.test(key)?"anchor":/(نوع|تصنيف)/.test(key)?"cat":/قسط/.test(key)?"inst":/(اصل|المبلغ|مبلغ)/.test(key)?"amount":/(ربح|نسبه|فائد)/.test(key)?"rate":/طريق/.test(key)?"rtype":/مد/.test(key)?"months":/تكرار/.test(key)?"freq":/وقت العمل/.test(key)?"work":/(بدايه|استحقاق|تاريخ)/.test(key)?"start":/وقت/.test(key)?"time":/مرتبط/.test(key)?"link":/ملاحظ/.test(key)?"note":null;if(K)f[K]=val}
  if(!kind&&!Object.keys(f).length)continue;

  if(!it.title)it.errs.push("بدون اسم");

   if(f.link)it.linkName=f.link}
  else{it.cat=catOf(kind,f.cat);it.amount=toNum(f.amount);it.start=dateOf(f.start)||ymd(new Date());it.months=f.months!=null?monthsOf(f.months):0;if(f.note)it.note=f.note;it.remind=true;
   if(kind==="debt"){it.rateType=/متناق|reduc/.test(norm(f.rtype||""))?"reducing":"flat";it.rate=f.rate!=null?toNum(f.rate):0;const inst=f.inst!=null?toNum(f.inst):0;
    if(!it.months)it.errs.push("بدون مدة");
    if(!it.amount&&inst&&it.months){it.amount=inst*it.months;it.rate=0}
    else if(it.amount&&inst&&it.months&&!f.rate){const profit=inst*it.months-it.amount;if(profit>0)it.rate=+(profit/it.amount/(it.months/12)*100).toFixed(2);it.rateType="flat"}}

  items.push(it)}
 const pool=[...finRecs(),...items.filter(x=>x.kind&&FINK.includes(x.kind)&&!x.errs.length)];

function buildICS(days,cats,alarm){const E=s=>String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g," ");

 const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");const out=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//gh//ar//EN","CALSCALE:GREGORIAN","X-WR-CALNAME:gh"];let n=0;
 const t0=startOfDay(new Date());
 for(let i=0;i<days;i++){const d=addDays(t0,i),ds=ymd(d);for(const t of tasksFor(ds)){if(!cats.includes(t.cat))continue;
  const h=t.time!=null&&isFinite(t.time)?t.time:9;const s=new Date(d.getFullYear(),d.getMonth(),d.getDate(),0,Math.round(h*60));const e=new Date(s.getTime()+15*6e4);n++;
  out.push("BEGIN:VEVENT",`UID:${t.id}-${ds}@gh.local`,`DTSTAMP:${stamp}`,`DTSTART:${F(s)}`,`DTEND:${F(e)}`,`SUMMARY:${E(t.title)}`,"BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${E(t.title)}`,`TRIGGER:-PT${alarm}M`,"END:VALARM","END:VEVENT")}}

 if(a==="copyem"){const p=HL().p;copyText(`فصيلة الدم: ${p.blood||"—"}\nالحساسية: ${p.allergy||"—"}\nالأمراض المزمنة: ${p.cond||"—"}\nاتصال الطوارئ: ${p.ecName||"—"} ${p.ecPhone||""}`)}});
function logSheet(){const ds=ymd(new Date()),lg=HLOG.get(ds);openSheet("قياسات اليوم",`<div class="card">${inRow("l-w","الوزن (كجم)",lg.weight,"مثال 78.5")}${inRow("l-sl","نوم الليلة الماضية (ساعات)",lg.sleep,"مثال 7")}${inRow("l-st","عدد الخطوات",lg.steps,"من تطبيق الصحة أو الساعة","numeric")}
  ${fr("المزاج",`<select id="l-md">${opts(Object.fromEntries(MOOD.map((m,i)=>[i,i?m:"—"])),lg.mood||0)}</select>`)}${inRow("l-bp","ضغط الدم",lg.bp,"مثال 120/80","text")}${inRow("l-sg","السكر (ملغ/دل)",lg.sugar,"اختياري")}</div>
  <div class="help">التطبيق ما يقرأ من تطبيق الصحة تلقائياً لأنه معزول عن الإنترنت. اكتب الأرقام بنفسك.</div>`,
  {action:"حفظ",onMount(el,api){api.onAct=()=>{const n=id=>{const v=toNum(gv(el,id));return v?v:null};HLOG.set(ds,"weight",n("l-w"));HLOG.set(ds,"sleep",n("l-sl"));HLOG.set(ds,"steps",n("l-st"));HLOG.set(ds,"mood",+gv(el,"l-md")||null);HLOG.set(ds,"bp",gv(el,"l-bp").trim()||null);HLOG.set(ds,"sugar",n("l-sg"));
   const w=n("l-w");if(w)HL().p.weight=w;save();api.close();refresh();toast("تم الحفظ")}}})}
function profileSheet(){const p=HL().p;openSheet("ملفي الصحي",`<div class="card">${inRow("p-h","الطول (سم)",p.height,"مثال 175")}${inRow("p-w","الوزن (كجم)",p.weight,"مثال 78")}${inRow("p-b","تاريخ الميلاد",p.birth,"","","date")}${fr("الجنس",`<select id="p-s">${opts({m:"ذكر",f:"أنثى"},p.sex)}</select>`)}
  ${fr("فصيلة الدم",`<select id="p-bl">${opts(Object.fromEntries(["","A+","A-","B+","B-","AB+","AB-","O+","O-"].map(x=>[x,x||"—"])),p.blood)}</select>`)}${inRow("p-al","الحساسية",p.allergy,"مثال: بنسلين","text")}${inRow("p-c","الأمراض المزمنة",p.cond,"مثال: ضغط","text")}${inRow("p-en","اسم اتصال الطوارئ",p.ecName,"","text")}${inRow("p-ep","رقم اتصال الطوارئ",p.ecPhone,"","tel")}</div>`,
  {action:"حفظ",onMount(el,api){api.onAct=()=>{Object.assign(p,{height:toNum(gv(el,"p-h"))||"",weight:toNum(gv(el,"p-w"))||"",birth:gv(el,"p-b"),sex:gv(el,"p-s"),blood:gv(el,"p-bl"),allergy:gv(el,"p-al").trim(),cond:gv(el,"p-c").trim(),ecName:gv(el,"p-en").trim(),ecPhone:gv(el,"p-ep").trim()});save();api.close();refresh();toast("تم الحفظ")}}})}
function goalsSheet(){const g=HL().g;let ex=[...(g.ex||[])],wOn=g.wOn,bed=g.bed;
 openSheet("الأهداف والعادات",`<div class="card">${inRow("g-w","هدف الماء (أكواب)",g.water,"","numeric")}${inRow("g-sl","هدف النوم (ساعات)",g.sleep,"")}${inRow("g-st","هدف الخطوات",g.steps,"","numeric")}
  ${fr("تذكير الماء",`<span style="flex:1"></span>${swHTML(wOn,'id="g-won"',"تذكير الماء")}`)}${fr("تذكير وقت النوم قبل الفجر",`<span style="flex:1"></span>${swHTML(bed,'id="g-bed"',"تذكير النوم")}`)}</div>
  <div class="sec">${H4("أيام التمرين")}<div class="chips">${DAYS.map((n,i)=>`<button class="pill ${ex.includes(i)?"on":""}" data-ex="${i}">${n}</button>`).join("")}</div></div>
  <div class="card">${fr("وقت التمرين",`<select id="g-at">${opts({fajr:"بعد الفجر",dhuhr:"بعد الظهر",asr:"بعد العصر",maghrib:"بعد المغرب",isha:"بعد العشاء"},g.exAt)}</select>`)}</div>
  <div class="help">وقت النوم يُحسب ليكفيك عدد الساعات قبل أذان الفجر، ويتأخر تذكير الماء والتمرين تلقائياً في أيام الصيام لما بعد المغرب.</div>`,
  {action:"حفظ",onMount(el,api){el.addEventListener("click",e=>{const x=e.target.closest("[data-ex]");if(x){const i=+x.dataset.ex;ex=ex.includes(i)?ex.filter(v=>v!==i):[...ex,i];x.classList.toggle("on",ex.includes(i));return}
   const s=e.target.closest("#g-won,#g-bed");if(s){const v=s.id==="g-won"?(wOn=!wOn):(bed=!bed);s.classList.toggle("on",v);s.setAttribute("aria-checked",v)}});
   api.onAct=()=>{Object.assign(g,{water:Math.max(1,Math.round(toNum(gv(el,"g-w"))||8)),sleep:Math.min(14,Math.max(3,toNum(gv(el,"g-sl"))||7.5)),steps:Math.round(toNum(gv(el,"g-st"))||8000),wOn,bed,ex,exAt:gv(el,"g-at")});save();api.close();refresh();toast("تم الحفظ")}}})}
function medSheet(m){const isNew=!m;const d={title:"",dose:"",times:["08:00"],recur:"daily",start:ymd(new Date()),months:"",stock:"",...(m||{})};
 const sh=openSheet(isNew?"دواء جديد":"تعديل الدواء",`<div class="card">${inRow("m-t","اسم الدواء",d.title,"","text")}${inRow("m-d","الجرعة",d.dose,"مثال: حبة | 500 مجم","text")}${inRow("m-tm","الأوقات",(d.times||[]).join(", "),"08:00, 20:00","text")}
  ${fr("التكرار",`<select id="m-r">${opts({daily:"يومي",weekly:"أسبوعي بيوم البداية"},d.recur)}</select>`)}${fr("تاريخ البداية",`<input id="m-s" type="date" value="${esc(d.start)}">`)}${inRow("m-m","مدة العلاج (أشهر)",d.months||"","فاضي = مستمر","numeric")}${inRow("m-st","المخزون (حبات)",d.stock,"يتناقص مع كل جرعة، وينبهك قبل ما يخلص","numeric")}</div>
  <div class="help">الأوقات بنظام 24 ساعة وتفصلها فاصلة. كل جرعة تظهر مهمة في جدولك وتصل ساعتك إذا صدّرت التذكيرات للتقويم. تعليم الجرعة «نفذ» ينقص المخزون.</div>${isNew?"":`<button class="btn danger" id="m-del">حذف الدواء</button>`}`,
  {action:"حفظ",onMount(el,api){api.onAct=()=>{const title=gv(el,"m-t").trim();if(!title){toast("اكتب اسم الدواء");return}const times=gv(el,"m-tm").split(/[,،;؛]/).map(timeOf).filter(Boolean);if(!times.length){toast("اكتب وقت الجرعة");return}
   const st=gv(el,"m-st").trim();const o={id:m?.id||uid(),kind:"med",title,dose:gv(el,"m-d").trim(),times,recur:gv(el,"m-r"),start:gv(el,"m-s")||ymd(new Date()),months:Math.round(toNum(gv(el,"m-m")))||0,stock:st===""?"":Math.max(0,Math.round(toNum(st)))};
   if(isNew)V.records.push(o);else Object.assign(byId(m.id),o);save();api.close();refresh();toast("تم الحفظ")}}});
 if(!isNew)confirmDel(sh,"m-del",()=>{removeRecord(m.id);save()})}
function apptSheet(a){const isNew=!a;const d={title:"",date:ymd(addDays(new Date(),7)),time:"",place:"",cost:"",note:"",...(a||{})};
 const sh=openSheet(isNew?"موعد جديد":"تعديل الموعد",`<div class="card">${inRow("a-t","الموعد",d.title,"مثال: فحص عيون","text")}${fr("التاريخ",`<input id="a-d" type="date" value="${esc(d.date)}">`)}${fr("الوقت",`<input id="a-tm" type="time" value="${esc(d.time||"")}">`)}${inRow("a-p","المكان / الطبيب",d.place,"","text")}${inRow("a-c","التكلفة المتوقعة",d.cost,"ر.س")}</div>
  <div class="help">يظهر في جدولك يوم الموعد، ويذكّرك قبلها بيوم. إذا كتبت التكلفة يضاف مصروف مرة واحدة في مالي بتاريخ الموعد (صحة).</div>${isNew?"":`<button class="btn danger" id="a-del">حذف الموعد</button>`}`,
  {action:"حفظ",onMount(el,api){api.onAct=()=>{const title=gv(el,"a-t").trim();if(!title){toast("اكتب اسم الموعد");return}const cost=toNum(gv(el,"a-c"));const o={id:a?.id||uid(),kind:"appt",title,date:gv(el,"a-d")||ymd(new Date()),time:gv(el,"a-tm"),place:gv(el,"a-p").trim(),cost:cost||""};
   if(isNew){V.records.push(o);if(cost){const e={id:uid(),kind:"expense",title:"موعد: "+title,cat:"health",amount:cost,freq:"once",months:0,start:o.date,remind:false,link:undefined};V.records.push(e);o.expense=e.id}}
   else{Object.assign(byId(a.id),o);const e=a.expense&&byId(a.expense);if(e){e.amount=cost||e.amount;e.start=o.date}}save();api.close();refresh();toast("تم الحفظ")}}});
 if(!isNew)confirmDel(sh,"a-del",()=>{removeRecord(a.id);save()})}


function relSummary(now){const ps=prayerStats(),R=REL();return`صلوات اليوم <span class="num">${Math.round(ps.todayPct/20)}/5</span><br>${R.q.on?`القرآن صفحة <span class="num">${R.q.page}</span>`:esc(fHijri.format(now))}`}
function hlSummary(now){const g=HL().g,w=HLOG.get(ymd(now)).water||0,nd=nextDose();return`ماء <span class="num">${w}/${g.water}</span> كوب<br>${nd?`الدواء ${esc(hourLabel(nd.time))}`:"لا جرعات قادمة"}`}
function previewSub(p){if(p.kind==="med")return`${esc(p.dose||"")} ${esc((p.times||[]).join("، "))}`;if(p.kind==="appt")return`${esc(p.date||"")}${p.time?" · "+esc(p.time):""}${p.place?" · "+esc(p.place):""}`;return`${p.anchor&&p.anchor!=="time"?"بعد "+ANCH[p.anchor]:esc(p.time||"")} · ${REC[p.recur]}`}

/* ───────── SETTINGS ───────── */
function renderSettings(){const el=$("#s-settings");const c=city();
 el.innerHTML=`${navBar("الإعدادات")}<div class="wrap">
 <div class="sec">${H4("الحساب")}<div class="card">${fr("الاسم",`<input id="s-name" value="${esc(V.name)}" maxlength="24">`)}<button class="row" data-s="code"><div class="g t">تغيير رمز الدخول</div>${I.chev}</button></div></div>
 <div class="sec">${H4("المنطقة والصلاة")}<div class="card">${fr("المدينة",`<select id="s-city">${opts(Object.fromEntries(Object.entries(CITIES).map(([k,v])=>[k,v[0]])),V.settings.city)}</select>`)}
  ${fr("أوقات الصلاة في جدولي",`<span style="flex:1"></span><button class="switch ${V.settings.prayers!==false?"on":""}" data-s="pr" role="switch" aria-checked="${V.settings.prayers!==false}" aria-label="أوقات الصلاة"></button>`)}</div>
  <div class="help">طريقة أم القرى: الفجر 18.5°، والعشاء بعد المغرب بـ 90 دقيقة و120 في رمضان. ${esc(c.name)}: <span class="num">${c.lat.toFixed(3)}, ${c.lng.toFixed(3)}</span></div></div>
 <div class="sec">${H4("التذكيرات والساعة")}<div class="card"><button class="row" data-s="cal"><div class="g"><div class="t">تصدير التذكيرات إلى التقويم</div><div class="s">تنبيهات الصلاة والأدوية والأقساط على الآيفون وساعة آبل</div></div>${I.chev}</button></div></div>
 <div class="sec">${H4("البيانات",`${V.records.length} سجل`)}<div class="card">
  <button class="row" data-s="sum"><div class="g"><div class="t">نسخ ملخصي MD</div><div class="s">كل بياناتك كملف Markdown مقروء</div></div>${I.chev}</button>
  <button class="row" data-s="backup"><div class="g"><div class="t">نسخ نسخة احتياطية مشفرة</div><div class="s">نص مشفر ما ينفتح إلا برمزك</div></div>${I.chev}</button>
  <button class="row" data-s="restore"><div class="g t">استعادة نسخة احتياطية</div>${I.chev}</button>
  <button class="row" data-s="lock"><div class="g t">قفل التطبيق الآن</div>${I.chev}</button>
  <button class="row" data-s="wipe"><div class="g t neg" id="wipe-t">حذف كل البيانات</div></button></div></div>
 <div class="sec">${H4("الأمان")}<div class="card pin" style="font-size:13.5px;line-height:1.85;color:var(--ink-2)">قاعدة بيانات واحدة تجمع الدخل والديون والمصاريف والمهام، مشفرة بـ AES‑256‑GCM ومفتاحها مشتق من رمزك (PBKDF2 بـ 600 ألف تكرار). الرمز ما يُحفظ في أي مكان، والتطبيق ما يتصل بأي خادم.</div></div>
 <div style="display:flex;justify-content:center;padding-top:4px"><div class="medal" style="width:70px;height:70px">${KHATAM()}${MARK.replace('class="mark"','class="mark" style="width:32px;height:32px"')}</div></div>
 </div>`}
$("#s-settings").addEventListener("input",e=>{if(e.target.id==="s-name"){V.name=e.target.value.trim()||V.name;save()}});
$("#s-settings").addEventListener("change",e=>{if(e.target.id==="s-city"){V.settings.city=e.target.value;save();RENDER["s-settings"]();toast("تم تحديث المدينة")}});
$("#s-settings").addEventListener("click",async e=>{const b=e.target.closest("[data-s]");if(!b)return;const a=b.dataset.s;
 if(a==="pr"){V.settings.prayers=V.settings.prayers===false;save();RENDER["s-settings"]()}
 if(a==="lock")lockNow();
 if(a==="wipe"){if(b.dataset.sure){store.del(LS_V);store.del(LS_L);MEMBLOB=null;lockNow();toast("حُذفت كل البيانات")}else{b.dataset.sure="1";$("#wipe-t").textContent="اضغط مرة ثانية للحذف النهائي"}}
 if(a==="sum"){const s=summaryMD("all");const sh=openSheet("ملخصي MD",`<textarea id="sm" class="mono" readonly style="min-height:260px;border:1px solid var(--line);border-radius:12px;background:var(--card)">${esc(s)}</textarea><button class="btn" id="smc">${I.copy}نسخ</button>`);$("#smc",sh.el).addEventListener("click",()=>copyText(s,$("#sm",sh.el)))}
 if(a==="backup"){const blob=await seal(V,KEY,SALT);const sh=openSheet("نسخة احتياطية",`<textarea id="bk" class="mono" readonly style="border:1px solid var(--line);border-radius:12px;background:var(--card);word-break:break-all">${esc(blob)}</textarea><button class="btn" id="bkc">${I.copy}نسخ</button><div class="help">احفظ النص في الملاحظات. ما ينفتح إلا برمز الدخول اللي كان وقت النسخ.</div>`);$("#bkc",sh.el).addEventListener("click",()=>copyText(blob,$("#bk",sh.el)))}
 if(a==="restore"){const sh=openSheet("استعادة",`<textarea id="rs" class="mono" placeholder="الصق النسخة الاحتياطية هنا" style="border:1px solid var(--line);border-radius:12px;background:var(--card)"></textarea><button class="btn" id="rsgo">استعادة وقفل</button><div class="help">بتحل النسخة محل البيانات الحالية، وبعدها تدخل برمز النسخة.</div>`);
  $("#rsgo",sh.el).addEventListener("click",()=>{const v=$("#rs",sh.el).value.trim();try{const o=JSON.parse(v);if(!o.ct||!o.iv||!o.salt)throw 0;store.set(LS_V,v);MEMBLOB=v;sh.close();lockNow();toast("أدخل رمز النسخة")}catch(_){toast("النص غير صالح")}})}
 if(a==="code")changeCode();if(a==="cal")calSheet()});
function changeCode(){const sh=openSheet("رمز جديد",`<div class="cstage" style="display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:6px"></div>`,{onClose(){padState=null}});const host=$(".cstage",sh.el);
 sh.el.addEventListener("click",e=>{const k=e.target.closest("[data-k]");if(k)keyIn(k.dataset.k)});
 const first=()=>codeStage({host,title:"اختر الرمز الجديد",hint:"أرقام أو الرموز @ & # * .",onDone:c1=>codeStage({host,title:"أكّد الرمز الجديد",onDone:async c2=>{if(c1!==c2){fail("غير متطابق، أعد من البداية");setTimeout(first,600);return}
  $(".hint",host).innerHTML=spin;SALT=crypto.getRandomValues(new Uint8Array(16));KEY=await deriveKey(c2,SALT);const blob=await seal(V,KEY,SALT);MEMBLOB=blob;store.set(LS_V,blob);padState=null;sh.close();toast("تم تغيير الرمز")}})});first()}

function refresh(){const top=stack[stack.length-1];if(top&&top!=="s-add")RENDER[top]?.()}
const RENDER={"s-home":renderHome,"s-finance":renderFinance,"s-schedule":renderSchedule,"s-add":renderAdd,"s-religion":renderReligion,"s-health":renderHealth,"s-settings":renderSettings};
setInterval(()=>{const t=fClock.format(new Date());for(const id of["lclock","hclock"]){const e=document.getElementById(id);if(e&&e.textContent!==t)e.textContent=t}},5000);
let hidAt=0;document.addEventListener("visibilitychange",()=>{if(document.hidden){if(V)hidAt=Date.now()}else if(V&&hidAt&&Date.now()-hidAt>300000)lockNow()});
show("s-login");renderLogin();
})();
</script>
