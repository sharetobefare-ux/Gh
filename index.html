/* Layout: one phone-width app column; screens stack like an iOS navigation controller (RTL: forward slides in from the left). Single deliberate dark identity: night ink ground, saffron + palm-green from the gh mark. */
:root{
  --ink:#0C1416; --ink-2:#111C1F; --raise:#16242826; --glass:rgba(232,242,236,.06); --glass-2:rgba(232,242,236,.10);
  --line:rgba(232,242,236,.09); --fg:#EDF2EE; --fg-2:rgba(237,242,238,.64); --fg-3:rgba(237,242,238,.40);
  --saffron:#E4B04C; --palm:#3DAA80; --rose:#E36B5D; --amber:#E8A13A; --sky:#74B6D4;
  --kufi:"Reem Kufi","Geeza Pro","Noto Kufi Arabic",system-ui,sans-serif;
  --ui:-apple-system,"SF Arabic","SF Pro Text",system-ui,"Segoe UI",Tahoma,sans-serif;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--ui);font-size:16px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.tab{font-variant-numeric:tabular-nums}

#app{position:relative;height:100%;max-width:440px;margin:0 auto;overflow:hidden;background:var(--ink)}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--ink);will-change:transform;-webkit-overflow-scrolling:touch}
.screen .wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;display:flex;flex-direction:column;gap:18px}
.dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}

/* identity backdrop: square-kufic lattice + two soft lights */
.lattice{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lattice::before{content:"";position:absolute;inset:-20%;background:
  radial-gradient(42% 30% at 82% 12%,rgba(228,176,76,.20),transparent 70%),
  radial-gradient(46% 34% at 12% 88%,rgba(61,170,128,.18),transparent 70%)}

/* ───────── crypto: one key = the 6-char code ───────── */
const ITER=600000,enc=new TextEncoder(),dec=new TextDecoder();

async function deriveKey(code,salt,iter=ITER){const base=await crypto.subtle.importKey("raw",enc.encode(code),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function seal(obj,key,salt){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,enc.encode(JSON.stringify(obj)));return JSON.stringify({v:1,alg:"AES-256-GCM",kdf:"PBKDF2-SHA256",iter:ITER,salt:b64(salt),iv:b64(iv),ct:b64(ct)})}
async function open(blob,code){const o=JSON.parse(blob);const salt=unb64(o.salt);const key=await deriveKey(code,salt,o.iter||ITER);const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(o.iv)},key,unb64(o.ct));return{data:JSON.parse(dec.decode(pt)),key,salt}}

/* ───────── springs (Apple-style: response + damping, interruptible) ───────── */
class Spring{constructor(v,cb){this.x=v;this.v=0;this.t=v;this.cb=cb;this.raf=0}
 to(t,{response=.38,damping=1,velocity}={}){this.t=t;if(velocity!=null)this.v=velocity;this.k=Math.pow(2*Math.PI/response,2);this.c=4*Math.PI*damping/response;
  if(reduceMotion){this.set(t);return Promise.resolve()}
  return new Promise(res=>{this.done=res;if(!this.raf){let last=performance.now();const step=now=>{let dt=Math.min(.064,(now-last)/1000);last=now;const n=Math.max(1,Math.ceil(dt/(1/240)));const h=dt/n;
    for(let i=0;i<n;i++){const a=-this.k*(this.x-this.t)-this.c*this.v;this.v+=a*h;this.x+=this.v*h}
    if(Math.abs(this.x-this.t)<.3&&Math.abs(this.v)<4){this.x=this.t;this.v=0;this.raf=0;this.cb(this.x);const d=this.done;this.done=null;d&&d();return}
    this.cb(this.x);this.raf=requestAnimationFrame(step)};this.raf=requestAnimationFrame(step)}})}
 set(x){cancelAnimationFrame(this.raf);this.raf=0;this.x=this.t=x;this.v=0;this.cb(x);const d=this.done;this.done=null;d&&d()}
 stop(){cancelAnimationFrame(this.raf);this.raf=0}}
const project=(v,d=.998)=>(v/1000)*d/(1-d);
const rubber=(o,dim,c=.55)=>(o*dim*c)/(dim+c*Math.abs(o));
function tracker(){const h=[];return{push(x){const t=performance.now();h.push([x,t]);while(h.length>1&&t-h[0][1]>100)h.shift()},vel(){if(h.length<2)return 0;const [x0,t0]=h[0],[x1,t1]=h[h.length-1];return t1>t0?(x1-x0)/((t1-t0)/1000):0}}}

/* ───────── navigation stack (RTL: forward enters from the left) ───────── */
const app=$("#app");const stack=[];
const W=()=>app.clientWidth;
function place(top,under,x){top.style.transform=`translate3d(${x}px,0,0)`;if(under){under.style.transform=`translate3d(${.3*(x+W())}px,0,0)`;const d=under.querySelector(":scope>.dim");if(d)d.style.opacity=String(.35*(1+x/W()))}}
function show(id){for(const s of app.querySelectorAll(".screen")){s.hidden=s.id!==id;s.style.transform=""}stack.length=0;stack.push(id)}
function push(id){const under=$("#"+stack[stack.length-1]),top=$("#"+id);RENDER[id]&&RENDER[id]();top.hidden=false;top.scrollTop=0;stack.push(id);ensureDim(under);
 const sp=new Spring(-W(),x=>place(top,under,x));top._sp=sp;sp.set(-W());sp.to(0,{response:.42,damping:1})}
function pop(velocity){if(stack.length<2)return;const top=$("#"+stack[stack.length-1]),under=$("#"+stack[stack.length-2]);
 const sp=top._sp||new Spring(0,x=>place(top,under,x));sp.cb=x=>place(top,under,x);stack.pop();RENDER[under.id]&&RENDER[under.id]();ensureDim(under);
 sp.to(-W(),{response:.38,damping:1,velocity}).then(()=>{if(stack[stack.length-1]===under.id){top.hidden=true;top.style.transform="";under.style.transform="";const d=under.querySelector(":scope>.dim");d&&(d.style.opacity="0")}})}
function ensureDim(s){if(!s.querySelector(":scope>.dim")){const d=document.createElement("div");d.className="dim";s.appendChild(d)}}
/* interactive back swipe from the right edge */
(()=>{let st=null;
 app.addEventListener("pointerdown",e=>{if(stack.length<2||$(".sheet-wrap"))return;const r=app.getBoundingClientRect();if(e.clientX<r.right-26)return;
  const top=$("#"+stack[stack.length-1]),under=$("#"+stack[stack.length-2]);top._sp&&top._sp.stop();
  st={id:e.pointerId,x0:e.clientX,base:top._sp?top._sp.x:0,top,under,tr:tracker(),live:false};st.tr.push(e.clientX)},{passive:true});
 app.addEventListener("pointermove",e=>{if(!st||e.pointerId!==st.id)return;let x=st.base+(e.clientX-st.x0);if(!st.live){if(Math.abs(e.clientX-st.x0)<10)return;st.live=true;try{app.setPointerCapture(e.pointerId)}catch(_){}}
  if(x>0)x=rubber(x,W());st.tr.push(e.clientX);place(st.top,st.under,x);st.cur=x});
 const end=e=>{if(!st||e.pointerId!==st.id)return;const s=st;st=null;if(!s.live)return;const v=s.tr.vel();const proj=(s.cur||0)+project(v);
  const sp=s.top._sp||new Spring(s.cur||0,x=>place(s.top,s.under,x));s.top._sp=sp;sp.x=s.cur||0;sp.cb=x=>place(s.top,s.under,x);
  if(proj<-W()/2)pop(v);else sp.to(0,{response:.35,damping:Math.abs(v)>300?.82:1,velocity:v})};
 app.addEventListener("pointerup",end);app.addEventListener("pointercancel",end)})();

/* ───────── sheets (drag to dismiss, momentum-projected) ───────── */
function openSheet(title,body,{action,onMount,onClose}={}){
 const wrap=document.createElement("div");wrap.className="sheet-wrap";
 wrap.innerHTML=`<div class="scrim"></div><div class="sheet" role="dialog" aria-label="${esc(title)}"><div class="grab"><div class="hd"><button class="iconbtn" data-x="close">إلغاء</button><h3>${esc(title)}</h3><span class="end">${action?`<button class="iconbtn" data-x="act" style="font-weight:700">${esc(action)}</button>`:""}</span></div></div><div class="body">${body}</div></div>`;
 app.appendChild(wrap);const sh=$(".sheet",wrap),scrim=$(".scrim",wrap);const H=()=>sh.offsetHeight||500;
 const sp=new Spring(H(),y=>{sh.style.transform=`translate3d(0,${y}px,0)`;scrim.style.opacity=String(Math.max(0,1-y/H()))});sp.set(H());sp.to(0,{response:.4,damping:1});
 const api={el:wrap,close(v){sp.to(H()+20,{response:.32,damping:1,velocity:v}).then(()=>{wrap.remove();onClose&&onClose()})}};
 scrim.addEventListener("click",()=>api.close());
 wrap.addEventListener("click",e=>{const b=e.target.closest("[data-x]");if(!b)return;if(b.dataset.x==="close")api.close();if(b.dataset.x==="act"&&action){api.onAct&&api.onAct()}});
 const g=$(".grab",wrap);let st=null;
 g.addEventListener("pointerdown",e=>{if(e.target.closest("button"))return;sp.stop();st={id:e.pointerId,y0:e.clientY,base:sp.x,tr:tracker()};st.tr.push(e.clientY);g.setPointerCapture(e.pointerId)});

 const end=()=>{if(!st)return;const v=st.tr.vel();st=null;const p=sp.x+project(v);if(p>H()*.45)api.close(v);else sp.to(0,{response:.3,damping:Math.abs(v)>300?.8:1,velocity:v})};
 g.addEventListener("pointerup",end);g.addEventListener("pointercancel",end);
 onMount&&onMount(sh,api);return api}

/* ───────── prayer times (Umm al-Qura: Fajr 18.5°, Isha +90 min / +120 in Ramadan) ───────── */
const D2R=Math.PI/180,R2D=180/Math.PI;
const dsin=d=>Math.sin(d*D2R),dcos=d=>Math.cos(d*D2R),dtan=d=>Math.tan(d*D2R),darcsin=x=>Math.asin(x)*R2D,darccos=x=>Math.acos(Math.max(-1,Math.min(1,x)))*R2D,darctan2=(y,x)=>Math.atan2(y,x)*R2D,darccot=x=>Math.atan(1/x)*R2D;
const fix=(a,b)=>{a=a-b*Math.floor(a/b);return a<0?a+b:a};
function prayerTimes(date,lat,lng,tz){
 let y=date.getFullYear(),m=date.getMonth()+1,d=date.getDate();if(m<=2){y-=1;m+=12}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);
 const jd=Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5-lng/(15*24);
 const sun=t=>{const D=jd+t-2451545,g=fix(357.529+.98560028*D,360),q=fix(280.459+.98564736*D,360),L=fix(q+1.915*dsin(g)+.02*dsin(2*g),360),e=23.439-.00000036*D;
  const RA=fix(darctan2(dcos(e)*dsin(L),dcos(L))/15,24);return{decl:darcsin(dsin(e)*dsin(L)),eqt:q/15-RA}};
 const noon=t=>fix(12-sun(t).eqt,24);
 const angleT=(ang,t,ccw)=>{const dc=sun(t).decl,n=noon(t),T=darccos((-dsin(ang)-dsin(dc)*dsin(lat))/(dcos(dc)*dcos(lat)))/15;return n+(ccw?-T:T)};
 const asr=t=>{const dc=sun(t).decl;return angleT(-darccot(1+dtan(Math.abs(lat-dc))),t)};
 const adj=h=>h+tz-lng/15;
 const sunset=adj(angleT(.833,18/24));const ram=hijriMonth(date)===9;
 return{fajr:adj(angleT(18.5,5/24,true)),sunrise:adj(angleT(.833,6/24,true)),dhuhr:adj(noon(12/24)),asr:adj(asr(13/24)),maghrib:sunset,isha:sunset+(ram?2:1.5)}}
const PRAYERS=[["fajr","الفجر"],["dhuhr","الظهر"],["asr","العصر"],["maghrib","المغرب"],["isha","العشاء"]];
const CITIES={riyadh:["الرياض",24.7136,46.6753],jeddah:["جدة",21.4858,39.1925],makkah:["مكة المكرمة",21.3891,39.8579],madinah:["المدينة المنورة",24.5247,39.5692],dammam:["الدمام",26.4207,50.0888],khobar:["الخبر",26.2172,50.1971],abha:["أبها",18.2164,42.5053],taif:["الطائف",21.2703,40.4158],buraydah:["بريدة",26.3260,43.9750],hail:["حائل",27.5114,41.7208],tabuk:["تبوك",28.3835,36.5662],jazan:["جازان",16.8892,42.5511],najran:["نجران",17.5650,44.2289],ahsa:["الأحساء",25.3830,49.5860]};
const city=()=>{const s=V.settings;const c=CITIES[s.city]||CITIES.riyadh;return{name:c[0],lat:c[1],lng:c[2],tz:s.tz??3}};
function nextPrayer(now=new Date()){const c=city();const t=prayerTimes(now,c.lat,c.lng,c.tz);const h=now.getHours()+now.getMinutes()/60;for(const [k,n] of PRAYERS)if(t[k]>h)return{name:n,at:t[k],mins:Math.round((t[k]-h)*60)};const t2=prayerTimes(addDays(now,1),c.lat,c.lng,c.tz);return{name:"الفجر",at:t2.fajr,mins:Math.round((24-h+t2.fajr)*60)}}

/* ───────── finance engine ───────── */
const FREQ={daily:["يومي",365/12],weekly:["أسبوعي",52/12],monthly:["شهري",1],yearly:["سنوي",1/12],once:["مرة واحدة",0]};
const CAT={income:{salary:"راتب",freelance:"عمل حر",business:"تجارة",rent:"إيجار",invest:"استثمار",other:"أخرى"},
 debt:{personal:"تمويل شخصي",home:"تمويل عقاري",car:"تمويل سيارة",card:"بطاقة ائتمانية",private:"دين لشخص",other:"أخرى"},
 expense:{housing:"سكن",bills:"فواتير",transport:"مواصلات",food:"أكل",family:"أسرة",subs:"اشتراكات",other:"أخرى"}};
function loan(it){const P=it.amount||0,n=Math.max(1,Math.round(it.months||1)),r=(it.rate||0)/100;let inst,profit;
 if(r<=0){inst=P/n;profit=0}else if(it.rateType==="reducing"){const i=r/12;inst=P*i/(1-Math.pow(1+i,-n));profit=inst*n-P}else{profit=P*r*n/12;inst=(P+profit)/n}
 let apr=0;if(profit>0){let lo=0,hi=1;for(let k=0;k<80;k++){const i=(lo+hi)/2;const pv=inst*(1-Math.pow(1+i,-n))/i;pv>P?lo=i:hi=i}apr=((lo+hi)/2)*12*100}
 return{inst,profit,apr,n,P}}
function debtState(it,today){const L=loan(it);const start=parse(it.start);let paid=0;for(let k=1;k<=L.n;k++){if(addMonths(start,k)<=today)paid++;else break}
 const rem=L.n-paid;const end=addMonths(start,L.n);let remPrincipal;
 if(it.rateType==="reducing"&&it.rate>0){const i=it.rate/1200;remPrincipal=L.P*Math.pow(1+i,paid)-L.inst*(Math.pow(1+i,paid)-1)/i}else remPrincipal=L.P*(rem/L.n);
 return{...L,paid,rem,end,remTotal:L.inst*rem,remProfit:L.inst*rem-remPrincipal,next:rem>0?addMonths(start,paid+1):null}}
function flowState(it,today){const start=parse(it.start);const months=it.months||0;const end=months?addMonths(start,months):null;
 const active=!end||today<end;const remMonths=end?Math.max(0,monthsBetween(today,end)+(today<end?1:0)):Infinity;
 return{active,end,remMonths:Math.min(remMonths,months?months:Infinity),monthly:active?(it.amount||0)*FREQ[it.freq||"monthly"][1]:0}}
function finance(today=new Date()){const t=new Date(today.getFullYear(),today.getMonth(),today.getDate());let inc=0,exp=0,inst=0,incY=0,expY=0,remDebt=0,remProfit=0,lastEnd=null;const debts=[];
 for(const it of V.items){if(it.kind==="debt"){const s=debtState(it,t);if(s.rem>0){inst+=s.inst;expY+=s.inst*Math.min(12,s.rem);remDebt+=s.remTotal;remProfit+=Math.max(0,s.remProfit);if(!lastEnd||s.end>lastEnd)lastEnd=s.end;debts.push({it,s})}}
  else{const f=flowState(it,t);if(!f.active)continue;const y=f.monthly*Math.min(12,f.remMonths);if(it.kind==="income"){inc+=f.monthly;incY+=y}else{exp+=f.monthly;expY+=y}}}
 const out=exp+inst,net=inc-out;
 return{inc,exp,inst,out,net,incY,outY:expY,netY:incY-expY,remDebt,remProfit,lastEnd,debts,dbr:inc?inst/inc:0,save:inc?net/inc:0}}
function upcoming(days=30){const t0=new Date();t0.setHours(0,0,0,0);const t1=addDays(t0,days);const out=[];
 for(const it of V.items){const start=parse(it.start);
  if(it.kind==="debt"){const s=debtState(it,t0);for(let k=s.paid+1;k<=s.n;k++){const d=addMonths(start,k);if(d>t1)break;if(d>=t0)out.push({d,it,amt:-s.inst,label:`قسط ${k} من ${s.n}`})}continue}
  const f=it.freq||"monthly";const end=it.months?addMonths(start,it.months):null;const sign=it.kind==="income"?1:-1;
  if(f==="once"){if(start>=t0&&start<=t1)out.push({d:start,it,amt:sign*it.amount,label:"مرة واحدة"});continue}
  if(f==="daily")continue;
  const mb=Math.max(0,monthsBetween(start,t0));let k=f==="weekly"?Math.max(0,Math.floor((t0-start)/(7*864e5))):f==="monthly"?Math.max(0,mb-1):Math.max(0,Math.floor(mb/12)-1);
  let d=f==="weekly"?addDays(start,7*k):f==="monthly"?addMonths(start,k):addMonths(start,12*k);const k0=k;while(d<=t1&&k-k0<60){if(d>=t0&&(!end||d<end))out.push({d,it,amt:sign*it.amount,label:FREQ[f][0]});k++;d=f==="daily"?addDays(start,k):f==="weekly"?addDays(start,7*k):f==="monthly"?addMonths(start,k):addMonths(start,12*k)}}
 return out.sort((a,b)=>a.d-b.d)}

/* ───────── tasks engine ───────── */
const TCAT={general:"عام",money:"مالي",personal:"شخصي",prayer:"صلاة"};
const REC={once:"مرة",daily:"يومي",weekly:"أسبوعي",monthly:"شهري",yearly:"سنوي"};
function occurs(tk,ds){const d=parse(ds),s=parse(tk.date);if(d<s)return false;switch(tk.recur){case"once":return ds===tk.date;case"daily":return true;case"weekly":return d.getDay()===s.getDay();
 case"monthly":{const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return d.getDate()===Math.min(s.getDate(),last)}case"yearly":return d.getMonth()===s.getMonth()&&d.getDate()===s.getDate()}return false}
function tasksFor(ds){const d=parse(ds);const list=[];const c=city();
 if(V.settings.prayers!==false){const t=prayerTimes(d,c.lat,c.lng,c.tz);for(const [k,n] of PRAYERS)list.push({id:"p-"+k,title:"صلاة "+n,time:t[k],cat:"prayer"})}
 for(const it of V.items)if(it.kind==="income"&&it.work&&it.work.on){const s=parse(it.start);const ok=d>=s&&(it.work.recur==="daily"||d.getDay()===(it.work.weekday??s.getDay()));const end=it.months?addMonths(s,it.months):null;
  if(ok&&(!end||d<end))list.push({id:"w-"+it.id,title:"وقت عمل: "+it.title,time:hhmmToH(it.work.time),cat:"money"})}
 for(const tk of V.tasks)if(occurs(tk,ds))list.push({id:"t-"+tk.id,title:tk.title,time:hhmmToH(tk.time),cat:tk.cat,ref:tk.id});
 const prev=ymd(addDays(d,-1)),pl=V.log[prev]||{};const have=new Set(list.map(x=>x.id));
 for(const id in pl)if(pl[id]==="later"&&!have.has(id)){const src=V.carry?.[id];if(src)list.push({...src,id,carried:true})}
 return list.sort((a,b)=>(a.time??99)-(b.time??99))}
function dayScore(ds,isPast){if(V.created&&ds<V.created)return{list:[],done:0,later:0,miss:0,pend:0,tot:0,score:null,by:{}};const list=tasksFor(ds),log=V.log[ds]||{};let done=0,later=0,miss=0,pend=0;const by={};
 for(const t of list){const st=log[t.id];const b=by[t.cat]||(by[t.cat]={done:0,tot:0});
  if(st==="done"){done++;b.done++;b.tot++}else if(st==="later"){later++;b.done+=.5;b.tot++}else if(st==="missed"||isPast){miss++;b.tot++}else pend++}
 const tot=done+later+miss;return{list,done,later,miss,pend,tot,score:tot?Math.round(100*(done+.5*later)/tot):null,by}}

 const nm=$("#nm"),go=$("#nmgo");nm.addEventListener("input",()=>go.disabled=!nm.value.trim());
 const nameStageCode=name=>()=>codeStage({title:"اختر رمزاً من 6 خانات",hint:"أرقام أو الرموز @ & # * .",onDone:c1=>codeStage({title:"أكّد الرمز",onDone:async c2=>{if(c1!==c2){fail("الرمزان غير متطابقين");setTimeout(nameStageCode(name),450);return}await create(name,c1)}})});
 go.addEventListener("click",()=>{const name=nm.value.trim();if(name)nameStageCode(name)()});nm.addEventListener("keydown",e=>{if(e.key==="Enter"){const name=nm.value.trim();if(name)nameStageCode(name)()}})}
let padState=null;
function codeStage({title,hint="",onDone,host}){const st=host||$("#stage");
 st.innerHTML=`<div class="prompt" id="pt">${esc(title)}</div><div class="slots" id="slots">${"<div class=slot></div>".repeat(6)}</div><div class="hint" id="ht">${esc(hint)}</div>
 <div class="pad" id="pad">${KEYS.map(k=>k==="del"?`<button class="key" data-k="del" aria-label="حذف">${I.del}</button>`:`<button class="key${/\d/.test(k)?"":" sym"}" data-k="${esc(k)}">${esc(k)}</button>`).join("")}</div>`;
 padState={code:"",busy:false,onDone,host:st};paintSlots()}
function paintSlots(){const s=padState.host.querySelectorAll(".slot");s.forEach((x,i)=>x.classList.toggle("on",i<padState.code.length))}
function fail(msg){if(!padState)return;const s=$(".slots",padState.host);if(!s)return;s.classList.remove("shake");void s.offsetWidth;s.classList.add("shake","err");const h=$(".hint",padState.host);if(h)h.textContent=msg;setTimeout(()=>{s.classList.remove("err")},500);padState.code="";paintSlots()}
function keyIn(k){if(!padState||padState.busy)return;const L=lockState();if(L.until&&Date.now()<L.until){fail(`انتظر ${Math.ceil((L.until-Date.now())/1000)} ثانية`);return}
 if(k==="del"){padState.code=padState.code.slice(0,-1);paintSlots();return}if(padState.code.length>=6)return;padState.code+=k;paintSlots();
 if(padState.code.length===6){const c=padState.code;padState.busy=true;setTimeout(async()=>{try{await padState.onDone(c)}finally{if(padState)padState.busy=false}},120)}}
$("#login").addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(b)keyIn(b.dataset.k)});
document.addEventListener("keydown",e=>{if($("#s-login").hidden||!padState||document.activeElement?.id==="nm")return;if(e.key==="Backspace")keyIn("del");else if(KEYS.includes(e.key))keyIn(e.key)});
async function tryUnlock(code){const h=$(".hint",padState.host);h.innerHTML='<span class="spinner" style="display:inline-block;vertical-align:middle"></span>';
 try{const o=await open(vaultBlob(),code);V=o.data;KEY=o.key;SALT=o.salt;setLock({});enter()}
 catch(e){const L=lockState();const f=(L.fails||0)+1;const o={fails:f};if(f>=5)o.until=Date.now()+30000*Math.pow(2,f-5);setLock(o);fail(f>=5?"محاولات كثيرة، انتظر قليلاً":"رمز غير صحيح")}}
async function create(name,code){$(".hint",padState.host).innerHTML='<span class="spinner" style="display:inline-block;vertical-align:middle"></span>';SALT=crypto.getRandomValues(new Uint8Array(16));KEY=await deriveKey(code,SALT);V=newVault(name);const blob=await seal(V,KEY,SALT);MEMBLOB=blob;store.set(LS_V,blob);enter()}
function enter(){padState=null;RENDER["s-home"]();const home=$("#s-home"),login=$("#s-login");home.hidden=false;
 const sp=new Spring(0,p=>{login.style.opacity=String(1-p);login.style.transform=`scale(${1+.06*p})`;home.style.opacity=String(p);home.style.transform=`scale(${.96+.04*p})`});
 sp.to(1,{response:.45,damping:1}).then(()=>{login.hidden=true;login.style.cssText="";$("#login").innerHTML="";home.style.cssText="";stack.length=0;stack.push("s-home")})}
function lockNow(){V=null;KEY=null;SALT=null;document.querySelectorAll(".sheet-wrap").forEach(x=>x.remove());show("s-login");renderLogin()}

/* ───────── SCHEDULE ───────── */
let viewDate=null;
function ring(score){const r=34,c=2*Math.PI*r,v=score==null?0:score/100;return`<svg class="ring" viewBox="0 0 84 84"><circle cx="42" cy="42" r="${r}" fill="none" stroke="rgba(237,242,238,.10)" stroke-width="8"/><circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--palm)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c*v} ${c}" transform="rotate(-90 42 42)"/><text x="42" y="47" text-anchor="middle" fill="var(--fg)" font-size="19" font-weight="700" font-family="-apple-system,system-ui">${score==null?"–":score+"%"}</text></svg>`}
function weekChart(){const t=new Date();const days=[];for(let i=6;i>=0;i--){const d=addDays(t,-i);days.push({d,s:dayScore(ymd(d),i>0)})}
 const SD=["أحد","إثنين","ثلاثاء","أربعاء","خميس","جمعة","سبت"];
 const Wd=320,Hd=140,top=16,bot=24,axis=30,h=Hd-top-bot,bw=(Wd-axis-6)/7;
 const y=v=>top+h-(v/100)*h;
 let g=[0,50,100].map(v=>`<line x1="6" x2="${Wd-axis}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(237,242,238,.08)"/><text x="${Wd-axis+6}" y="${y(v)+4}" text-anchor="start" font-size="10" fill="rgba(237,242,238,.45)">${v}</text>`).join("");
 days.forEach((o,i)=>{const slot=Wd-axis-(i+1)*bw,x=slot+bw*.22,w=bw*.56,v=o.s.score??0,isT=i===6;const hh=o.s.score==null?0:Math.max(3,(v/100)*h);
  g+=`<rect x="${x}" y="${top+h-hh}" width="${w}" height="${hh}" rx="5" fill="${isT?"var(--saffron)":"rgba(61,170,128,.75)"}"/>`;
  if(o.s.score!=null)g+=`<text x="${x+w/2}" y="${top+h-hh-5}" text-anchor="middle" font-size="10" font-weight="700" fill="${isT?"var(--saffron)":"rgba(237,242,238,.55)"}">${v}</text>`;
  g+=`<text x="${x+w/2}" y="${Hd-7}" text-anchor="middle" font-size="10.5" fill="rgba(237,242,238,${isT?.9:.5})" font-family="-apple-system,system-ui">${isT?"اليوم":SD[o.d.getDay()]}</text>`});
 const tot={};days.forEach(o=>{for(const k in o.s.by){const b=tot[k]||(tot[k]={done:0,tot:0});b.done+=o.s.by[k].done;b.tot+=o.s.by[k].tot}});
 return{svg:`<svg class="chart" viewBox="0 0 ${Wd} ${Hd}" role="img" aria-label="الأداء آخر 7 أيام">${g}</svg>`,tot}}
function renderSchedule(){const el=$("#s-schedule");const now=new Date();if(!viewDate)viewDate=ymd(now);const vd=parse(viewDate);const isToday=viewDate===ymd(now);const isPast=parse(viewDate)<parse(ymd(now));
 const sc=dayScore(viewDate,isPast);const log=V.log[viewDate]||{};const np=nextPrayer(now);const wk=weekChart();
 const catColor={prayer:"palm",money:"saffron",general:"sky",personal:"amber"};
 el.innerHTML=`${navBar("جدولي","add-task")}<div class="wrap">
 <div class="card pad-in"><div class="today"><div><div class="big tab">${isToday?esc(fClock.format(now)):esc(DAYS[vd.getDay()])}</div><div class="dates" style="text-align:start;margin-top:8px"><b>${esc(fHijri.format(vd))}</b><br>${esc(fGreg.format(vd))}</div></div>
  <div class="daynav"><button class="iconbtn" data-day="-1" aria-label="اليوم السابق">${I.back}</button><button class="iconbtn" data-day="1" aria-label="اليوم التالي" style="transform:scaleX(-1)">${I.back}</button></div></div>
  ${isToday?`<div class="next"><span class="dot" style="background:var(--palm)"></span>الصلاة القادمة <b>${esc(np.name)}</b> ${esc(hourLabel(np.at))} · بعد ${np.mins>=60?`${Math.floor(np.mins/60)} س `:""}${np.mins%60} د</div>`:`<div class="next"><button class="iconbtn" data-day="0" style="height:30px">العودة لليوم</button></div>`}</div>
 <div class="card pad-in"><div class="score">${ring(sc.score)}<div class="lbl"><b style="color:var(--fg);font-size:15px">نتيجة ${isToday?"اليوم":"اليوم المحدد"}</b><br>منجز ${sc.done} · مؤجل ${sc.later} · لم ينفذ ${sc.miss}${sc.pend?` · باقي ${sc.pend}`:""}</div></div>
  <div style="margin-top:14px">${wk.svg}</div>
  <div class="chips" style="margin-top:10px">${Object.entries(wk.tot).map(([k,b])=>`<span class="pill"><span class="dot" style="background:var(--${catColor[k]||"sky"})"></span>${TCAT[k]||k} <b class="num">${b.tot?Math.round(100*b.done/b.tot):0}%</b></span>`).join("")}</div>
  <div class="help" style="margin-top:8px;padding:0">السكور: المنجز 1، المؤجل نصف، وغير المنجز صفر. الأيام الماضية بدون تحديد تُحسب غير منجزة.</div></div>
 <div class="sec"><div class="legend"><span>${"<span class='dot' style='background:var(--palm)'></span>"}نفذ</span><span><span class="dot" style="background:var(--rose)"></span>لم ينفذ</span><span><span class="dot" style="background:var(--amber)"></span>يؤجل</span></div>
  <div class="card">${sc.list.length?sc.list.map(t=>{const st=log[t.id]||"";return`<div class="task st-${st}"><span class="time tab">${t.time!=null?esc(hourLabel(t.time)):"—"}</span><div class="grow"><div class="t">${esc(t.title)}</div><span class="chip">${TCAT[t.cat]||""}${t.carried?" · مؤجلة من أمس":""}</span></div>
   <div class="tri" role="group" aria-label="حالة المهمة"><button class="c3 done ${st==="done"?"on":""}" data-st="done" data-id="${t.id}" aria-label="نفذ">${I.ok}</button><button class="c3 miss ${st==="missed"?"on":""}" data-st="missed" data-id="${t.id}" aria-label="لم ينفذ">${I.x}</button><button class="c3 later ${st==="later"?"on":""}" data-st="later" data-id="${t.id}" aria-label="يؤجل">${I.later}</button></div></div>`}).join(""):`<div class="empty">ما فيه مهام لهذا اليوم.<button class="btn ghost" data-act="add-task">أضف مهمة</button></div>`}</div></div>
 ${V.tasks.length?`<div class="sec"><h4>مهامي المتكررة</h4><div class="card">${V.tasks.map(t=>`<button class="row" data-task="${t.id}"><span class="dot" style="background:var(--${catColor[t.cat]||"sky"})"></span><div class="grow"><div class="t">${esc(t.title)}</div><div class="s">${REC[t.recur]}${t.recur==="weekly"?` · كل ${DAYS[parse(t.date).getDay()]}`:""}${t.time?` · ${esc(hourLabel(hhmmToH(t.time)))}`:""}</div></div>${I.chev}</button>`).join("")}</div></div>`:""}
 </div>`}
$("#s-schedule").addEventListener("click",e=>{const a=e.target.closest("[data-act]");if(a&&a.dataset.act==="add-task"){taskSheet();return}
 const dn=e.target.closest("[data-day]");if(dn){const n=+dn.dataset.day;viewDate=n===0?ymd(new Date()):ymd(addDays(parse(viewDate),n));RENDER["s-schedule"]();return}
 const c=e.target.closest("[data-st]");if(c){const id=c.dataset.id,st=c.dataset.st;const L=V.log[viewDate]||(V.log[viewDate]={});
  if(L[id]===st)delete L[id];else{L[id]=st;if(st==="later"){const t=tasksFor(viewDate).find(x=>x.id===id);if(t){V.carry=V.carry||{};V.carry[id]={title:t.title,time:t.time,cat:t.cat}}}}
  save();RENDER["s-schedule"]();return}
 const tk=e.target.closest("[data-task]");if(tk)taskSheet(V.tasks.find(t=>t.id===tk.dataset.task))});
function taskSheet(task){const isNew=!task;const d={title:"",cat:"general",recur:"once",date:viewDate||ymd(new Date()),time:"",...(task||{})};
 const sh=openSheet(isNew?"مهمة جديدة":"تعديل المهمة",`<div class="card form">${fr("المهمة",`<input id="t-title" value="${esc(d.title)}" placeholder="مثال: مراجعة الأهداف">`)}
  ${fr("التصنيف",`<select id="t-cat">${opts({general:"عام",money:"مالي",personal:"شخصي"},d.cat)}</select>`)}
  ${fr("التكرار",`<select id="t-rec">${opts(REC,d.recur)}</select>`)}
  ${fr("التاريخ",`<input id="t-date" type="date" value="${esc(d.date)}">`)}
  ${fr("الوقت",`<input id="t-time" type="time" value="${esc(d.time)}">`)}</div>
  <div class="help">الأسبوعي يتكرر بنفس يوم التاريخ، والشهري بنفس رقم اليوم، والسنوي بنفس اليوم والشهر.</div>
  ${isNew?"":`<button class="btn danger" id="t-del">حذف المهمة</button>`}`,{action:"حفظ",onMount(el,api){api.onAct=()=>{const g=id=>$("#"+id,el).value;const title=g("t-title").trim();if(!title){toast("اكتب اسم المهمة");return}
   const t={id:task?.id||uid(),title,cat:g("t-cat"),recur:g("t-rec"),date:g("t-date")||ymd(new Date()),time:g("t-time")};if(isNew)V.tasks.push(t);else Object.assign(V.tasks.find(x=>x.id===task.id),t);save();api.close();RENDER["s-schedule"]();toast(isNew?"أضفت المهمة":"تم الحفظ")}}});
 sh.el.addEventListener("click",e=>{const del=e.target.closest("#t-del");if(!del)return;if(del.dataset.sure){V.tasks=V.tasks.filter(x=>x.id!==task.id);save();sh.close();RENDER["s-schedule"]();toast("تم الحذف")}else{del.dataset.sure="1";del.textContent="اضغط مرة ثانية لتأكيد الحذف"}})}

/* ───────── SETTINGS ───────── */
function renderSettings(){const el=$("#s-settings");const c=city();
 el.innerHTML=`${navBar("الإعدادات")}<div class="wrap">
 <div class="sec"><h4>الحساب</h4><div class="card form">${fr("الاسم",`<input id="s-name" value="${esc(V.name)}" maxlength="24">`)}<button class="row" data-s="code"><div class="grow t">تغيير رمز الدخول</div>${I.chev}</button></div></div>
 <div class="sec"><h4>المنطقة والصلاة</h4><div class="card form">${fr("المدينة",`<select id="s-city">${opts(Object.fromEntries(Object.entries(CITIES).map(([k,v])=>[k,v[0]])),V.settings.city)}</select>`)}
  ${fr("أوقات الصلاة في جدولي",`<span style="flex:1"></span><button class="switch ${V.settings.prayers!==false?"on":""}" data-s="pr" role="switch" aria-checked="${V.settings.prayers!==false}" aria-label="أوقات الصلاة"></button>`)}</div>
  <div class="help">طريقة الحساب: أم القرى (الفجر 18.5°، العشاء بعد المغرب بـ 90 دقيقة و120 في رمضان). ${esc(c.name)}: <span class="num">${c.lat.toFixed(3)}, ${c.lng.toFixed(3)}</span></div></div>
 <div class="sec"><h4>البيانات</h4><div class="card"><button class="row" data-s="backup"><div class="grow"><div class="t">نسخ نسخة احتياطية مشفرة</div><div class="s">نص مشفر لا يفتح إلا برمزك</div></div>${I.chev}</button>
  <button class="row" data-s="restore"><div class="grow t">استعادة نسخة احتياطية</div>${I.chev}</button><button class="row" data-s="lock"><div class="grow t">قفل التطبيق الآن</div>${I.chev}</button>
  <button class="row" data-s="wipe"><div class="grow t neg" id="wipe-t">حذف كل البيانات</div></button></div></div>
 <div class="sec"><h4>الأمان</h4><div class="card pad-in" style="font-size:13.5px;line-height:1.8;color:var(--fg-2)">كل بياناتك مشفرة بـ AES‑256‑GCM، والمفتاح مشتق من رمزك (PBKDF2 بـ 600 ألف تكرار). الرمز نفسه ما يُحفظ في أي مكان. التطبيق ما يتصل بأي خادم أو خدمة خارجية، وكل شيء على جهازك.</div></div>
 <div style="display:flex;justify-content:center;opacity:.6;padding-top:6px">${MARK.replace('class="mark"','class="mark" style="width:44px;height:44px"')}</div>
 </div>`}
$("#s-settings").addEventListener("input",e=>{if(e.target.id==="s-name"){V.name=e.target.value.trim()||V.name;save()}});
$("#s-settings").addEventListener("change",e=>{if(e.target.id==="s-city"){V.settings.city=e.target.value;save();RENDER["s-settings"]();toast("تم تحديث المدينة")}});
$("#s-settings").addEventListener("click",async e=>{const b=e.target.closest("[data-s]");if(!b)return;const a=b.dataset.s;
 if(a==="pr"){V.settings.prayers=V.settings.prayers===false;save();RENDER["s-settings"]()}
 if(a==="lock")lockNow();
 if(a==="wipe"){const t=$("#wipe-t");if(b.dataset.sure){store.del(LS_V);store.del(LS_L);MEMBLOB=null;lockNow();toast("حُذفت كل البيانات")}else{b.dataset.sure="1";t.textContent="اضغط مرة ثانية للحذف النهائي"}}
 if(a==="backup"){const blob=await seal(V,KEY,SALT);const sh=openSheet("نسخة احتياطية",`<textarea id="bk" readonly>${esc(blob)}</textarea><button class="btn" id="bkc">نسخ</button><div class="help">احفظ النص في الملاحظات أو أي مكان. ما ينفتح إلا برمز الدخول اللي كان وقت النسخ.</div>`);
  $("#bkc",sh.el).addEventListener("click",()=>{const ta=$("#bk",sh.el);navigator.clipboard?.writeText(blob).then(()=>toast("تم النسخ"),()=>{ta.select();toast("حدد النص وانسخه")})||(ta.select(),toast("حدد النص وانسخه"))})}
 if(a==="restore"){const sh=openSheet("استعادة",`<textarea id="rs" placeholder="الصق النسخة الاحتياطية هنا"></textarea><button class="btn" id="rsgo">استعادة وقفل</button><div class="help">بتحل النسخة محل البيانات الحالية، وبعدها تدخل برمز النسخة.</div>`);
  $("#rsgo",sh.el).addEventListener("click",()=>{const v=$("#rs",sh.el).value.trim();try{const o=JSON.parse(v);if(!o.ct||!o.iv||!o.salt)throw 0;store.set(LS_V,v);MEMBLOB=v;sh.close();lockNow();toast("أدخل رمز النسخة")}catch(_){toast("النص غير صالح")}})}
 if(a==="code")changeCode()});
function changeCode(){const sh=openSheet("رمز جديد",`<div class="cstage" style="display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:6px"></div>`,{onClose(){padState=null}});
 const host=$(".cstage",sh.el);
 sh.el.addEventListener("click",e=>{const k=e.target.closest("[data-k]");if(k)keyIn(k.dataset.k)});
 const first=()=>codeStage({host,title:"اختر الرمز الجديد",hint:"أرقام أو الرموز @ & # * .",onDone:c1=>codeStage({host,title:"أكّد الرمز الجديد",onDone:async c2=>{
  if(c1!==c2){fail("غير متطابق، أعد من البداية");setTimeout(first,600);return}
  $(".hint",host).innerHTML='<span class="spinner" style="display:inline-block;vertical-align:middle"></span>';
  SALT=crypto.getRandomValues(new Uint8Array(16));KEY=await deriveKey(c2,SALT);const blob=await seal(V,KEY,SALT);MEMBLOB=blob;store.set(LS_V,blob);padState=null;sh.close();toast("تم تغيير الرمز")}})});
 first()}

const RENDER={"s-home":renderHome,"s-finance":renderFinance,"s-schedule":renderSchedule,"s-religion":renderReligion,"s-settings":renderSettings};

/* clocks tick */
setInterval(()=>{const t=fClock.format(new Date());for(const id of["lclock","hclock"]){const e=document.getElementById(id);if(e&&e.textContent!==t)e.textContent=t}},5000);
document.addEventListener("visibilitychange",()=>{if(document.hidden&&V){/* re-lock after 5 min in background */window.__ghHid=Date.now()}else if(V&&window.__ghHid&&Date.now()-window.__ghHid>300000)lockNow()});

show("s-login");renderLogin();
})();
